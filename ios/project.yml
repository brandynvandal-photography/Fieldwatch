name: Fieldwatch
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  Fieldwatch:
    type: application
    platform: iOS
    sources: [Fieldwatch]
    info:
      path: Fieldwatch/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Fieldwatch passes safety alerts to nearby phones when there is no signal.
        NSBonjourServices: [_fieldwatch-rl._tcp, _fieldwatch-rl._udp, _fieldwatch-node._tcp]
        NSLocationWhenInUseUsageDescription: Used to sort festivals by distance from you.
        UIBackgroundModes: [audio, fetch, remote-notification]
        FieldwatchBackendURL: http://localhost:3000
        # The dev backend and every receiver node speak plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Fieldwatch/Fieldwatch.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
