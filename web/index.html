<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4F8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0E15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fieldwatch">
<meta name="description" content="Festival safety alerts: live National Weather Service alerts, hourly forecast and a 12-hour radar loop for the grounds.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<title>Fieldwatch</title>
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#EAEDF4; --surface-3:#DFE3EC;
  --ink:#0F1320; --ink-2:#3B4252; --muted:#6A7284; --line:#E2E5EE; --line-2:#CDD2DE;
  --accent:#4B4FE0; --accent-ink:#FFFFFF; --accent-soft:#E9EAFF;
  --ok:#1E9A62; --ok-2:#178A55; --ok-ink:#FFFFFF;
  --watch:#F0B23A; --watch-2:#E2951B; --watch-ink:#241800;
  --warn:#E64A3E; --warn-2:#C93327; --warn-ink:#FFFFFF;
  --rain:#3D8BE8; --temp:#EF8A2A;
  --map:#0E1420;
  --shadow:0 10px 30px rgba(15,19,32,.10);
  --radius:18px; --gutter:16px;
  --font-display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E15; --surface:#151A26; --surface-2:#1D2434; --surface-3:#273044;
    --ink:#EEF1F7; --ink-2:#C5CBD8; --muted:#98A1B4; --line:#262E40; --line-2:#354060;
    --accent:#9C9BFF; --accent-ink:#0B0E15; --accent-soft:#23264A;
    --ok:#2CAE72; --ok-2:#1F8F5C; --watch:#F0B241; --watch-2:#D9951E; --warn:#EE5548; --warn-2:#C63A2F;
    --rain:#5FA3F5; --temp:#FFA04A;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E15; --surface:#151A26; --surface-2:#1D2434; --surface-3:#273044;
  --ink:#EEF1F7; --ink-2:#C5CBD8; --muted:#98A1B4; --line:#262E40; --line-2:#354060;
  --accent:#9C9BFF; --accent-ink:#0B0E15; --accent-soft:#23264A;
  --ok:#2CAE72; --ok-2:#1F8F5C; --watch:#F0B241; --watch-2:#D9951E; --warn:#EE5548; --warn-2:#C63A2F;
  --rain:#5FA3F5; --temp:#FFA04A;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left}
input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
input::-webkit-search-decoration,input::-webkit-search-cancel-button{-webkit-appearance:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.display{font-family:var(--font-display);font-optical-sizing:auto;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

.screen{min-height:100%;max-width:560px;margin:0 auto;padding:0 var(--gutter) calc(48px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){
  .screen.in{animation:rise .22s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; height:56px; margin:0 calc(-1 * var(--gutter)); padding:0 8px;
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg); background:color-mix(in srgb,var(--bg) 84%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(16px); backdrop-filter:saturate(180%) blur(16px);
}
.topbar .side{min-width:88px;display:flex;align-items:center;gap:2px}
.topbar .side.r{justify-content:flex-end}
.topbar .mid{flex:1;text-align:center;font-weight:600;font-size:17px}
.tb{display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 8px;border-radius:12px;color:var(--accent);font-weight:500;font-size:17px}
.tb svg{width:22px;height:22px}
.tb:active{background:var(--surface-2)}
.tb[disabled]{opacity:.45}
.tb.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
h1.title{font-family:var(--font-display);font-optical-sizing:auto;font-weight:700;font-size:34px;line-height:1.06;letter-spacing:-.025em;text-wrap:balance;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;line-height:1.4;margin-bottom:18px;max-width:38ch}
.h{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 4px;letter-spacing:.01em}
.group{background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
button.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25}
.row .s{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.3}
.row .tr{text-align:right;color:var(--muted);font-size:13px;flex:none;line-height:1.3}
.row .tr b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.row .lead{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.row .lead svg{width:20px;height:20px}
.chev{width:18px;height:18px;color:var(--muted);flex:none;opacity:.6}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--warn);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.warn{background:var(--warn)} .dot.watch{background:var(--watch)} .dot.ok{background:var(--ok)} .dot.off{background:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.pill.off i{background:var(--muted)}
.pill.busy i{background:var(--accent);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px}
.card p{color:var(--muted);font-size:15px;line-height:1.45}
.card.quiet{background:transparent;box-shadow:none;border:1px dashed var(--line-2)}
.note{font-size:13px;color:var(--muted);margin:-6px 4px 22px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;margin-bottom:12px}
.btn.quiet{background:var(--surface);color:var(--accent);box-shadow:0 1px 0 var(--line)}
.btn:active{transform:scale(.99);opacity:.9}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:22px;box-shadow:0 1px 0 var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--muted)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-weight:600}

/* The one loud element: right now, in colour. */
.sky{position:relative;overflow:hidden;width:100%;border-radius:22px;padding:20px 20px 16px;margin-bottom:14px;color:var(--ok-ink);box-shadow:var(--shadow)}
.sky.ok{background:linear-gradient(160deg,var(--ok),var(--ok-2))}
.sky.watch{background:linear-gradient(160deg,var(--watch),var(--watch-2));color:var(--watch-ink)}
.sky.warn{background:linear-gradient(160deg,var(--warn),var(--warn-2));color:var(--warn-ink)}
.sky.none{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.sky .eyebrow{color:inherit;opacity:.8;margin:0 0 6px}
.sky h2{font-family:var(--font-display);font-optical-sizing:auto;font-size:30px;line-height:1.06;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.sky p{margin-top:8px;font-size:16px;line-height:1.4;opacity:.92;max-width:36ch}
.sky .strip{display:flex;gap:6px;margin-top:16px}
.sky .strip .c{flex:1;min-width:0;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 2px 7px;text-align:center;font-size:12px;line-height:1.2}
.sky.watch .strip .c{background:rgba(0,0,0,.09)}
.sky.none .strip .c{background:var(--surface-2)}
.sky .strip svg{width:22px;height:22px;margin:4px 0 3px;display:block;margin-left:auto;margin-right:auto}
.sky .strip b{display:block;font-size:14px;font-weight:600}
.sky .foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px;opacity:.85}
@media (prefers-reduced-motion:no-preference){
  .sky.warn::after{content:"";position:absolute;inset:0;border-radius:22px;border:2px solid #fff;opacity:0;animation:pulse 1.8s ease-out infinite;pointer-events:none}
  @keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.035)}}
}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.action{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:92px;position:relative;box-shadow:0 1px 0 var(--line)}
.action:active{background:var(--surface-2)}
.action .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.action .ic svg{width:20px;height:20px}
.action .t{font-weight:600;font-size:15px;line-height:1.2}
.action .s{font-size:12px;color:var(--muted);line-height:1.25;margin-top:-6px}
.action .badge{position:absolute;top:10px;right:10px}

/* Skeletons while the first fetch is out. */
.sk{background:var(--surface-2);border-radius:12px}
@media (prefers-reduced-motion:no-preference){
  .sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 40%,var(--surface-2) 60%);background-size:300% 100%;animation:shimmer 1.4s ease infinite}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
}

/* Alerts */
.alert{display:flex;gap:14px;width:100%;padding:14px 16px 14px 14px;position:relative}
.alert+.alert::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.alert .bar{width:4px;border-radius:2px;flex:none;align-self:stretch}
.alert .bar.warn{background:var(--warn)} .alert .bar.watch{background:var(--watch)}
.alert .main{flex:1;min-width:0}
.alert .t{font-weight:600;font-size:17px;line-height:1.25}
.alert .s{color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.alerthead{border-radius:22px;padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.alerthead.watch{background:linear-gradient(160deg,var(--watch),var(--watch-2));color:var(--watch-ink)}
.alerthead.warn{background:linear-gradient(160deg,var(--warn),var(--warn-2));color:var(--warn-ink)}
.alerthead .eyebrow{color:inherit;opacity:.85;margin:0 0 6px}
.alerthead h2{font-family:var(--font-display);font-optical-sizing:auto;font-size:30px;line-height:1.06;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.alerthead p{margin-top:8px;font-size:15px;opacity:.9}
.todo{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.todo .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.todo .ic svg{width:20px;height:20px}
.todo .t{font-weight:600;margin-bottom:2px}
.todo p{font-size:15px;line-height:1.45}
.kv{display:flex;gap:12px;padding:12px 16px;position:relative;font-size:15px}
.kv+.kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.kv .k{color:var(--muted);flex:none;width:96px}
.kv .v{flex:1;line-height:1.45}
.kv .v.right{text-align:right;font-weight:500}
.body{font-size:17px;line-height:1.5;margin-bottom:16px;color:var(--ink-2)}

/* Forecast */
.chart{position:relative;background:var(--surface);border-radius:var(--radius);padding:14px 10px 6px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.chart .lbl{font-size:13px;font-weight:600;color:var(--muted);margin:0 6px 4px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart .tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));display:none;z-index:2}
.chart .tip b{font-weight:700}
.hours{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gutter) 10px;margin:0 calc(-1 * var(--gutter)) 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:66px;background:var(--surface);border-radius:14px;padding:10px 4px;text-align:center;scroll-snap-align:start;box-shadow:0 1px 0 var(--line)}
.hr.now{background:var(--accent-soft)}
.hr .tm{font-size:12px;color:var(--muted)}
.hr svg{width:24px;height:24px;margin:7px auto 5px;display:block}
.hr .tp{font-weight:600;font-size:16px}
.hr .pp{font-size:11px;color:var(--rain);margin-top:2px;font-weight:600}

/* Radar */
.rmap{position:relative;width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--map);margin-bottom:10px;box-shadow:var(--shadow)}
.rmap .stage{position:absolute;left:0;top:0;width:512px;height:512px;transform-origin:0 0}
.rmap .tile{position:absolute;filter:saturate(.55) brightness(.82) contrast(1.05)}
.rmap .frame{position:absolute;left:0;top:0;width:512px;height:512px;opacity:0;transition:opacity .12s linear}
.rmap .frame.on{opacity:.8}
@media (prefers-reduced-motion:reduce){.rmap .frame{transition:none}}
.rmap .pin{position:absolute;left:256px;top:256px;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--accent),0 0 0 9px rgba(75,79,224,.25)}
.rmap .pinlabel{position:absolute;left:256px;top:270px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111;font-size:22px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap}
.rmap .stamp{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:#111;border-radius:14px;padding:8px 12px 7px;line-height:1.1}
.rmap .stamp b{display:block;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rmap .stamp span{font-size:12px;color:#555}
.rmap .legend{position:absolute;right:12px;bottom:14px;background:rgba(255,255,255,.94);color:#111;border-radius:999px;font-size:12px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.rmap .legend i{display:block;width:56px;height:8px;border-radius:999px;background:linear-gradient(90deg,#2fb04a,#ffe600,#f2a900,#c8102e,#a020a0)}
.rmap .progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .25s}
.rmap .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#fff;font-size:15px}
.rctl{display:flex;align-items:center;gap:12px;margin:2px 0 0}
.play{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px}
.play:active{transform:scale(.96)}
.scrubwrap{flex:1;min-width:0}
input[type=range].scrub{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range].scrub::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line-2)}
input[type=range].scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3);margin-top:-8px}
input[type=range].scrub::-moz-range-track{height:6px;border-radius:3px;background:var(--line-2)}
input[type=range].scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.ticks{display:flex;justify-content:space-between;padding:0 6px 0 66px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin:-6px 0 14px}

/* Settings and misc */
.field{display:flex;align-items:center;gap:10px;padding:12px 16px}
.field input{flex:1;border:0;background:none;outline:none;min-width:0}
.field .k{color:var(--muted);font-size:14px;flex:none}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,16px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.link{color:var(--accent);font-weight:500;text-decoration:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Fieldwatch on the web. Same festivals, same sources and the same data shapes as the iPhone app:
// the backend when one is configured, otherwise the National Weather Service and the NEXRAD archive
// straight from the browser. Everything fetched is cached, so the last good data shows when signal drops.
const NWS = 'https://api.weather.gov';
const IEM_WMS = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q-t.cgi';
const OSM = 'https://tile.openstreetmap.org';
const ATTRIBUTION = 'NOAA NEXRAD via Iowa Environmental Mesonet';
const HOURS = 12, DIRECT_STEP_MIN = 15, LAG_MIN = 10, HALF_M = 160000, SIZE = 512, R = 6378137;
const DAY = 86400000;
// Inside a Claude artifact preview the browser is not allowed to reach outside hosts.
const IN_PREVIEW = !!(window.claude && typeof window.claude.use === 'function');
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const S = { screen: 'picker', param: null, stack: [], fest: null, cache: {}, backend: '', busy: false, query: '' };
let FESTS = [];
const STORE = 'fieldwatch.web';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE) || '{}'); Object.assign(S, { fest: d.fest || null, cache: d.cache || {}, backend: d.backend || '' }); }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({ fest: S.fest, cache: S.cache, backend: S.backend })); }catch(e){}
}
const backend = () => (new URLSearchParams(location.search).get('backend') || S.backend || '').replace(/\/+$/, '');
const fest = () => FESTS.find(f => f.id === S.fest);
const data = f => S.cache[f.id] || {};
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// ---- time --------------------------------------------------------------------------------------------
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtHour = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric' }).replace(/\s/g, ' ');
const fmtDay = iso => new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtWhen = iso => new Date(iso).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const fmtFull = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function ago(iso){
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 6) / 10;
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago';
}
// End stamps sit at local midnight after the last day, so nudge back six hours before naming the day.
const lastDay = f => new Date(Date.parse(f.endDate) - 6 * 3600000);
const fmtRange = f => { const a = fmtDay(f.startDate), b = fmtDay(lastDay(f)); return a === b ? a : `${a} – ${b}`; };
function phase(f, now = Date.now()){
  const start = Date.parse(f.startDate), end = Date.parse(f.endDate);
  if (now > end) return { key: 'ended', text: 'Ended' };
  if (now >= start - 3 * DAY) {
    if (now >= start) return { key: 'now', text: 'Happening now' };
    const d = Math.ceil((start - now) / DAY);
    return { key: 'now', text: d <= 1 ? 'Starts tomorrow' : `Starts in ${d} days` };
  }
  const d = Math.round((start - now) / DAY);
  return { key: d <= 14 ? 'soon' : 'later', text: `In ${d} days` };
}

// ---- weather data (mirrors backend/src/nws.js and NWSClient.swift) ---------------------------------
async function getJSON(url, headers){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(url, { headers: headers || {}, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const GEO = { Accept: 'application/geo+json' };
const pt = f => `${f.latitude.toFixed(4)},${f.longitude.toFixed(4)}`;
const normalizeAlert = ft => { const p = ft.properties; return {
  id: p.id, event: p.event, headline: p.headline ?? null, body: p.description ?? '', instruction: p.instruction ?? null,
  severity: String(p.severity || 'Unknown').toLowerCase(), area: p.areaDesc ?? '', source: p.senderName ?? 'National Weather Service',
  issuedAt: p.effective, expiresAt: p.ends ?? p.expires ?? null, channel: 'weather', relayCount: 0 }; };
const isWarning = a => a.severity === 'severe' || a.severity === 'extreme';
const isActive = a => !a.expiresAt || Date.parse(a.expiresAt) > Date.now();
const activeAlerts = f => (data(f).alerts || []).filter(isActive).sort((a, b) => (isWarning(b) - isWarning(a)));
const level = f => { const al = activeAlerts(f); return al.some(isWarning) ? 'warn' : al.length ? 'watch' : 'ok'; };

async function loadAlerts(f){
  const b = backend();
  if (b) { try { return await getJSON(`${b}/festivals/${f.id}/alerts`); } catch(e) {} }   // fall back to NWS, like the app
  const fc = await getJSON(`${NWS}/alerts/active?point=${pt(f)}`, GEO);
  return (fc.features || []).map(normalizeAlert);
}
async function loadHourly(f){
  const point = await getJSON(`${NWS}/points/${pt(f)}`, GEO);
  const fc = await getJSON(point.properties.forecastHourly, GEO);
  return fc.properties.periods.slice(0, 36).map(x => ({ startTime: x.startTime, temperature: x.temperature, shortForecast: x.shortForecast, windSpeed: x.windSpeed, precipChance: x.probabilityOfPrecipitation?.value ?? null }));
}

/** Pull everything for the chosen festival. Whatever succeeds replaces the cache; whatever fails leaves the last good copy. */
async function refresh(f){
  if (!f || S.busy) return;
  S.busy = true; render();
  const b = backend();
  const [al, hr, po, inc] = await Promise.allSettled([
    loadAlerts(f), loadHourly(f),
    b ? getJSON(`${b}/festivals/${f.id}/posts`) : Promise.resolve(data(f).posts || []),
    b ? getJSON(`${b}/festivals/${f.id}/incidents`) : Promise.resolve(null),
  ]);
  const next = { ...data(f) };
  let ok = false;
  if (al.status === 'fulfilled') { next.alerts = al.value; ok = true; }
  if (hr.status === 'fulfilled') { next.hourly = hr.value; ok = true; }
  if (po.status === 'fulfilled') next.posts = po.value;
  if (inc.status === 'fulfilled') next.incidents = inc.value;
  next.checkedAt = new Date().toISOString();
  if (ok) { next.at = next.checkedAt; next.error = null; }
  else next.error = (al.reason && al.reason.message) || (hr.reason && hr.reason.message) || 'unreachable';
  S.cache[f.id] = next; S.busy = false; save(); render();
}

// ---- radar (mirrors backend/src/radar.js) --------------------------------------------------------------
const mercator = (lat, lon) => ({ x: R * lon * Math.PI / 180, y: R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) });
function coverage(f){ const c = mercator(f.latitude, f.longitude); return [c.x - HALF_M, c.y - HALF_M, c.x + HALF_M, c.y + HALF_M]; }
const isoMin = t => new Date(t).toISOString().replace(/\.\d{3}Z$/, 'Z');
function iemURL(bbox, t){
  const p = new URLSearchParams({ SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap', LAYERS: 'nexrad-n0q-wmst', STYLES: '', SRS: 'EPSG:3857',
    BBOX: bbox.map(n => n.toFixed(0)).join(','), WIDTH: SIZE, HEIGHT: SIZE, FORMAT: 'image/png', TRANSPARENT: 'true', TIME: isoMin(t) });
  return `${IEM_WMS}?${p}`;
}
async function radarLoop(f){
  const b = backend(), bbox = coverage(f);
  if (b) {
    const m = await getJSON(`${b}/festivals/${f.id}/radar`);
    return { bbox, frames: m.frames.map(x => ({ time: x.time, url: /^https?:/.test(x.url) ? x.url : b + x.url })), attribution: m.attribution, hours: m.hours, step: m.stepMinutes };
  }
  // Straight from the archive: 12 hours at 15-minute steps, newest at least 10 minutes old (composites land late).
  const step = DIRECT_STEP_MIN * 60000, newest = Math.floor((Date.now() - LAG_MIN * 60000) / step) * step, frames = [];
  for (let t = newest - HOURS * 3600000 + step; t <= newest; t += step) frames.push({ time: isoMin(t), url: iemURL(bbox, t) });
  return { bbox, frames, attribution: ATTRIBUTION, hours: HOURS, step: DIRECT_STEP_MIN };
}
/** OpenStreetMap tiles under the radar square, placed in the same Web Mercator metres. Zoom 8 is about 610 m per pixel. */
function tiles(bbox){
  const z = 8, world = 40075016.686, tileM = world / 2 ** z, mpp = (bbox[2] - bbox[0]) / SIZE, out = [];
  const tx0 = Math.floor((bbox[0] + world / 2) / tileM), tx1 = Math.floor((bbox[2] + world / 2) / tileM);
  const ty0 = Math.floor((world / 2 - bbox[3]) / tileM), ty1 = Math.floor((world / 2 - bbox[1]) / tileM);
  for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
    out.push({ url: `${OSM}/${z}/${tx}/${ty}.png`, left: (tx * tileM - world / 2 - bbox[0]) / mpp, top: (bbox[3] - (world / 2 - ty * tileM)) / mpp, size: tileM / mpp });
  }
  return out;
}

const radar = { frames: [], loaded: new Set(), failed: 0, index: 0, playing: true, timer: 0, loop: null };
function stopRadar(){ clearTimeout(radar.timer); radar.timer = 0; radar.frames = []; radar.loaded.clear(); radar.failed = 0; radar.loop = null; }
async function startRadar(f){
  stopRadar();
  let loop;
  try { loop = await radarLoop(f); } catch(e) { radar.loop = { error: e.message || 'unreachable', frames: [] }; render(); return; }
  if (S.screen !== 'radar') return;
  radar.loop = loop; radar.frames = loop.frames; radar.index = loop.frames.length - 1; radar.playing = true;
  render();
  fitStage();
  // Newest first, so the present shows while the past fills in.
  loop.frames.map((fr, i) => i).reverse().forEach(i => {
    const img = document.getElementById('fr' + i); if (!img) return;
    img.onload = () => { radar.loaded.add(i); if (radar.loaded.size === 1) { radar.index = i; showFrame(); tick(); } updateRadarNote(); };
    img.onerror = () => { radar.failed++; updateRadarNote(); };
    img.src = loop.frames[i].url;
  });
}
function nextLoaded(from){
  const n = radar.frames.length;
  for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (radar.loaded.has(i)) return i; }
  return from;
}
function tick(){
  clearTimeout(radar.timer);
  if (!radar.playing || !radar.frames.length) return;
  const last = radar.index === Math.max(...radar.loaded);
  radar.timer = setTimeout(() => { if (!radar.playing) return; radar.index = nextLoaded(radar.index); showFrame(); tick(); }, last ? 1500 : 120);
}
function showFrame(){
  document.querySelectorAll('.frame').forEach((el, i) => el.classList.toggle('on', i === radar.index));
  const fr = radar.frames[radar.index]; const t = document.getElementById('radar-time'), a = document.getElementById('radar-ago'), sl = document.getElementById('radar-slider');
  if (fr && t) { t.textContent = fmtTime(fr.time); a.textContent = ago(fr.time); }
  if (sl) sl.value = radar.index;
}
function radarScrub(v){ radar.playing = false; clearTimeout(radar.timer); radar.index = +v; showFrame(); updatePlay(); }
function radarToggle(){ radar.playing = !radar.playing; updatePlay(); if (radar.playing) tick(); else clearTimeout(radar.timer); }
function updatePlay(){ const b = document.getElementById('radar-play'); if (!b) return; b.innerHTML = radar.playing ? I.pause : I.play; b.setAttribute('aria-label', radar.playing ? 'Pause' : 'Play'); }
function updateRadarNote(){
  const total = radar.frames.length, got = radar.loaded.size;
  const bar = document.getElementById('radar-progress'); if (bar) bar.style.width = total ? `${Math.round(100 * (got + radar.failed) / total)}%` : '0';
  if (bar && got + radar.failed >= total) setTimeout(() => { bar.style.opacity = '0'; }, 400);
  const n = document.getElementById('radar-loaded'); if (!n) return;
  n.textContent = got === total ? '' : radar.failed === total
    ? (IN_PREVIEW ? 'This preview cannot reach the radar archive. Open the hosted build to see it live.' : 'Cannot reach the radar archive right now.')
    : `Loading ${got} of ${total} frames`;
}
function fitStage(){
  const box = document.getElementById('rmap'), st = document.getElementById('stage');
  if (box && st) st.style.transform = `scale(${box.clientWidth / SIZE})`;
}
window.addEventListener('resize', fitStage);

// ---- navigation ------------------------------------------------------------------------------------------
function go(name, param, opts){
  opts = opts || {};
  stopRadar();
  if (!opts.replace) S.stack.push({ name: S.screen, param: S.param });
  if (opts.reset) S.stack = [];
  S.screen = name; S.param = param || null;
  render(false); window.scrollTo(0, 0);
  if (name === 'radar' && fest()) startRadar(fest());
}
function back(){
  stopRadar();
  const p = S.stack.pop();
  if (!p) { S.screen = S.fest ? 'home' : 'picker'; S.param = null; }
  else { S.screen = p.name; S.param = p.param; }
  render(true); window.scrollTo(0, 0);
}
function pick(id){ S.fest = id; save(); go('home', null, { reset: true }); refresh(fest()); }
function changeFestival(){ S.fest = null; save(); go('picker', null, { reset: true }); }

function glyph(h){
  const s = (h.shortForecast || '').toLowerCase(), hour = new Date(h.startTime).getHours(), night = hour < 6 || hour >= 20;
  if (s.includes('thunder')) return I.storm;
  if (s.includes('snow') || s.includes('sleet') || s.includes('ice')) return I.snow;
  if (s.includes('rain') || s.includes('shower') || s.includes('drizzle')) return I.rain;
  if (s.includes('fog') || s.includes('haze') || s.includes('smoke')) return I.fog;
  if (s.includes('windy') || s.includes('breezy')) return I.wind;
  if (s.includes('partly') || s.includes('mostly sunny') || s.includes('mostly clear')) return night ? I.moon : I.partly;
  if (s.includes('cloud') || s.includes('overcast')) return I.cloud;
  return night ? I.moon : I.sun;
}

// ---- forecast chart: two aligned panels, one measure each ---------------------------------------------
function chartSVG(hours){
  const W = 360, PADL = 30, PADR = 10, TOP = 22, TH = 92, GAP = 22, RH = 44, BOT = 22;
  const rainy = hours.some(h => (h.precipChance || 0) > 0);
  const H = TOP + TH + (rainy ? GAP + RH : 0) + BOT;
  const n = hours.length, x = i => PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1));
  const temps = hours.map(h => h.temperature), tmin = Math.min(...temps), tmax = Math.max(...temps);
  const lo = Math.floor((tmin - 3) / 5) * 5, hi = Math.ceil((tmax + 3) / 5) * 5;
  const y = t => TOP + TH - (t - lo) / (hi - lo) * TH;
  const pts = temps.map((t, i) => [x(i), y(t)]);
  // Catmull-Rom through the hourly points, so the curve passes through every reading.
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${d} L${pts.at(-1)[0].toFixed(1)},${TOP + TH} L${pts[0][0].toFixed(1)},${TOP + TH} Z`;
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${PADL}" x2="${W - PADR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${PADL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v)}°</text>`).join('');
  const iMax = temps.indexOf(tmax), iMin = temps.indexOf(tmin);
  const label = (i, v, above) => {
    const edge = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle', dx = i === 0 ? 9 : i === n - 1 ? -9 : 0;
    return `<text x="${(x(i) + dx).toFixed(1)}" y="${(y(v) + (edge === 'middle' ? (above ? -10 : 16) : 4)).toFixed(1)}" text-anchor="${edge}" font-size="11" font-weight="600" fill="var(--ink)">${Math.round(v)}°</text>`;
  };
  const marks = `<circle cx="${x(iMax).toFixed(1)}" cy="${y(tmax).toFixed(1)}" r="4" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/>${label(iMax, tmax, true)}`
    + (iMin !== iMax ? `<circle cx="${x(iMin).toFixed(1)}" cy="${y(tmin).toFixed(1)}" r="4" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/>${label(iMin, tmin, false)}` : '')
    + `<circle cx="${x(0).toFixed(1)}" cy="${y(temps[0]).toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--temp)" stroke-width="2.5"/>`;
  const labelsY = H - 6;
  const xlabels = hours.map((h, i) => i % 3 === 0 ? `<text x="${x(i).toFixed(1)}" y="${labelsY}" text-anchor="${i === 0 ? 'start' : 'middle'}" font-size="10" fill="var(--muted)">${i === 0 ? 'Now' : esc(fmtHour(h.startTime))}</text>` : '').join('');
  let rain = '';
  if (rainy) {
    const top = TOP + TH + GAP, base = top + RH, bw = Math.max(3, (W - PADL - PADR) / n - 2), rmax = Math.max(...hours.map(h => h.precipChance || 0));
    rain = `<text x="${PADL}" y="${top - 7}" font-size="10" font-weight="600" fill="var(--muted)">CHANCE OF RAIN</text><line x1="${PADL}" x2="${W - PADR}" y1="${base}" y2="${base}" stroke="var(--line)"/>`
      + hours.map((h, i) => { const v = h.precipChance || 0; if (!v) return ''; const hh = Math.max(3, RH * v / 100); return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(base - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="var(--rain)"/>`; }).join('')
      + (rmax ? `<text x="${x(hours.findIndex(h => (h.precipChance || 0) === rmax)).toFixed(1)}" y="${(base - RH * rmax / 100 - 5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${rmax}%</text>` : '');
  }
  return `<svg viewBox="0 0 ${W} ${H}" id="chart" data-n="${n}" role="img" aria-label="Temperature for the next ${n} hours, ${Math.round(tmin)} to ${Math.round(tmax)} degrees${rainy ? ', with chance of rain' : ''}">
    <defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--temp)" stop-opacity=".28"/><stop offset="1" stop-color="var(--temp)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#tg)"/><path d="${d}" fill="none" stroke="var(--temp)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>${marks}${rain}${xlabels}
    <g id="xh" style="display:none"><line id="xh-line" y1="${TOP - 6}" y2="${H - BOT + 4}" stroke="var(--ink)" stroke-opacity=".35" stroke-dasharray="3 3"/><circle id="xh-dot" r="5" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/></g>
  </svg>`;
}
function chartHover(){
  const svgEl = document.getElementById('chart'), tip = document.getElementById('tip'); if (!svgEl || !tip) return;
  const hours = (data(fest()).hourly || []).slice(0, 24), n = hours.length, PADL = 30, PADR = 10, W = 360;
  const at = clientX => {
    const r = svgEl.getBoundingClientRect(), fx = (clientX - r.left) / r.width * W;
    return Math.max(0, Math.min(n - 1, Math.round((fx - PADL) / (W - PADL - PADR) * (n - 1))));
  };
  const show = (e) => {
    const i = at(e.clientX), h = hours[i]; if (!h) return;
    const g = document.getElementById('xh'), r = svgEl.getBoundingClientRect(), x = PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1));
    const temps = hours.map(q => q.temperature), lo = Math.floor((Math.min(...temps) - 3) / 5) * 5, hi = Math.ceil((Math.max(...temps) + 3) / 5) * 5;
    const yy = 22 + 92 - (h.temperature - lo) / (hi - lo) * 92;
    g.style.display = ''; document.getElementById('xh-line').setAttribute('x1', x); document.getElementById('xh-line').setAttribute('x2', x);
    const dot = document.getElementById('xh-dot'); dot.setAttribute('cx', x); dot.setAttribute('cy', yy);
    tip.innerHTML = `<b>${esc(i === 0 ? 'Now' : fmtHour(h.startTime))}</b> ${Math.round(h.temperature)}° · ${esc(h.shortForecast)}${h.precipChance ? ` · ${h.precipChance}%` : ''}`;
    tip.style.display = 'block'; tip.style.left = `${(x / W) * r.width + (r.left - svgEl.parentElement.getBoundingClientRect().left)}px`; tip.style.top = `${(yy / (+svgEl.getAttribute('viewBox').split(' ')[3])) * r.height + (r.top - svgEl.parentElement.getBoundingClientRect().top)}px`;
  };
  const hide = () => { tip.style.display = 'none'; const g = document.getElementById('xh'); if (g) g.style.display = 'none'; };
  svgEl.addEventListener('pointerdown', show); svgEl.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
  svgEl.addEventListener('pointerup', hide); svgEl.addEventListener('pointerleave', hide); svgEl.addEventListener('pointercancel', hide);
}

// ---- alert text: NWS bullets become sections -----------------------------------------------------------------
function parseNWS(text){
  const parts = String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const sections = [], paragraphs = [];
  for (const p of parts) {
    const m = p.match(/^\*\s*([A-Z][A-Z /]+?)\.{2,}\s*(.*)$/);
    if (m) sections.push({ label: m[1].charAt(0) + m[1].slice(1).toLowerCase(), text: m[2] }); else paragraphs.push(p);
  }
  return { sections, paragraphs };
}
/** One line about the next hours, from the forecast itself. */
function outlook(f){
  const hr = (data(f).hourly || []).slice(0, 12); if (!hr.length) return '';
  const storm = hr.find(h => /thunder/i.test(h.shortForecast || ''));
  if (storm) return `Thunderstorms possible around ${fmtHour(storm.startTime)}.`;
  const wet = hr.find(h => (h.precipChance || 0) >= 50);
  if (wet) return `Rain likely around ${fmtHour(wet.startTime)}.`;
  const some = hr.find(h => (h.precipChance || 0) >= 25);
  if (some) return `A chance of rain from ${fmtHour(some.startTime)}.`;
  return 'Dry for the next 12 hours.';
}
