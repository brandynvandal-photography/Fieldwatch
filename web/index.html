<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fieldwatch">
<meta name="description" content="Festival safety alerts: live National Weather Service alerts, hourly forecast and a 12-hour radar loop for the grounds.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,1&display=swap">
<title>Fieldwatch</title>
<style>
:root{
  --bg:#FBFAFF; --ink:#1A1533; --ink-2:#3E3860; --muted:#6F6A8F; --line:rgba(26,21,51,.08);
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.84); --glass-border:rgba(255,255,255,.85);
  --accent:#7B5CF5; --accent-ink:#FFFFFF; --grad:linear-gradient(135deg,#FF5FA8 0%,#9B7BFF 58%,#4FE3FF 135%);
  --ok:#17B37A; --ok-2:#0E9563; --watch:#FFB03B; --watch-2:#F0951C; --watch-ink:#2A1B00; --warn:#F43F5E; --warn-2:#D8264B;
  --rain:#3FA9F5; --temp:#FF7A45; --map:#120F26;
  --pink:#FF5FA8; --tang:#FFB03B; --lime:#B8F53D; --cyan:#4FE3FF; --violet:#9B7BFF; --orb-opacity:.62;
  --shadow:0 12px 40px rgba(76,52,150,.14); --shadow-2:0 2px 12px rgba(76,52,150,.09);
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:24px; --gutter:18px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0A16; --ink:#F2EFFF; --ink-2:#CFC9EE; --muted:#A39EC4; --line:rgba(255,255,255,.08);
    --glass:rgba(22,18,42,.5); --glass-2:rgba(22,18,42,.78); --glass-border:rgba(255,255,255,.1);
    --accent:#B29CFF; --accent-ink:#0B0A16; --ok:#22C58A; --ok-2:#15A06E; --watch:#FFB847; --watch-2:#E89A22; --warn:#FF4D6D; --warn-2:#D8264B;
    --rain:#5FB8FF; --temp:#FF8E5C; --orb-opacity:.85;
    --shadow:0 14px 44px rgba(0,0,0,.45); --shadow-2:0 2px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0A16; --ink:#F2EFFF; --ink-2:#CFC9EE; --muted:#A39EC4; --line:rgba(255,255,255,.08);
  --glass:rgba(22,18,42,.5); --glass-2:rgba(22,18,42,.78); --glass-border:rgba(255,255,255,.1);
  --accent:#B29CFF; --accent-ink:#0B0A16; --ok:#22C58A; --ok-2:#15A06E; --watch:#FFB847; --watch-2:#E89A22; --warn:#FF4D6D; --warn-2:#D8264B;
  --rain:#5FB8FF; --temp:#FF8E5C; --orb-opacity:.85;
  --shadow:0 14px 44px rgba(0,0,0,.45); --shadow-2:0 2px 12px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left}
input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
input::-webkit-search-decoration,input::-webkit-search-cancel-button{-webkit-appearance:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-optical-sizing:auto}

/* Light behind everything: five slow orbs, blurred, under a frosted page. */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(54px);opacity:var(--orb-opacity);will-change:transform}
.orbs .o1{width:64vw;height:64vw;left:-20vw;top:-14vw;background:radial-gradient(circle,var(--pink),transparent 68%)}
.orbs .o2{width:56vw;height:56vw;right:-18vw;top:6vh;background:radial-gradient(circle,var(--tang),transparent 68%)}
.orbs .o3{width:60vw;height:60vw;left:-16vw;top:46vh;background:radial-gradient(circle,var(--lime),transparent 68%)}
.orbs .o4{width:66vw;height:66vw;right:-22vw;bottom:-16vw;background:radial-gradient(circle,var(--cyan),transparent 68%)}
.orbs .o5{width:52vw;height:52vw;left:24vw;top:28vh;background:radial-gradient(circle,var(--violet),transparent 68%)}
@media (prefers-reduced-motion:no-preference){
  .orbs i{animation:drift 26s ease-in-out infinite alternate}
  .orbs .o2{animation-duration:31s}.orbs .o3{animation-duration:23s}.orbs .o4{animation-duration:35s}.orbs .o5{animation-duration:19s;animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(7vw,-6vh) scale(1.14)}}
}
#app{position:relative;z-index:1}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--glass-border);box-shadow:var(--shadow-2)}

.screen{min-height:100%;max-width:560px;margin:0 auto;padding:0 var(--gutter) calc(48px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){
  .screen.in{animation:rise .26s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:62px;margin:0 calc(-1 * var(--gutter));padding:0 12px;display:flex;align-items:center;justify-content:space-between}
.topbar .side{min-width:92px;display:flex;align-items:center;gap:8px}
.topbar .side.r{justify-content:flex-end}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:42px;min-width:42px;padding:0 14px;border-radius:999px;color:var(--ink);font-weight:600;font-size:15px}
.tb.icon{width:42px;padding:0}
.tb svg{width:20px;height:20px}
.tb[disabled]{opacity:.45}
.tb.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.eyebrow{display:block;text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
h1.title{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-optical-sizing:auto;font-weight:600;font-size:42px;line-height:1.02;letter-spacing:-.015em;text-align:center;text-wrap:balance;margin:0 0 8px}
.sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.4;margin:0 auto 20px;max-width:34ch;text-wrap:balance}
.h{text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.note{text-align:center;font-size:12px;color:var(--muted);margin:-4px auto 22px;line-height:1.5;max-width:36ch}
.group{border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:62px;position:relative}
.row+.row::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
button.row:active{background:rgba(255,255,255,.35)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25}
.row .s{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.3}
.row .tr{text-align:right;color:var(--muted);font-size:12px;flex:none;line-height:1.3}
.row .tr b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.row .lead{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(155,123,255,.18);color:var(--accent)}
.row .lead svg{width:20px;height:20px}
.dotc{width:12px;height:12px;border-radius:50%;flex:none;background:hsl(var(--hue) 92% 62%);box-shadow:0 0 0 4px hsl(var(--hue) 92% 62% / .22)}
.chev{width:18px;height:18px;color:var(--muted);flex:none;opacity:.6}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--warn);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;flex:none;box-shadow:0 2px 8px rgba(244,63,94,.4)}
.card{border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center}
.card h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:600;font-size:22px;line-height:1.1;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px;line-height:1.45;max-width:32ch;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 22px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:17px;box-shadow:0 12px 30px rgba(155,123,255,.38);margin-bottom:12px;text-align:center}
.btn.quiet{background:var(--glass);color:var(--ink);box-shadow:var(--shadow-2);border:1px solid var(--glass-border)}
.search{display:flex;align-items:center;gap:10px;border-radius:999px;padding:12px 18px;margin-bottom:24px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--muted)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-weight:600}

/* Welcome */
.welcome{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0 30px}
.mark{position:relative;isolation:isolate;width:150px;height:150px;margin-bottom:28px}
.mark .glow{position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(from 0deg,var(--pink),var(--tang),var(--lime),var(--cyan),var(--violet),var(--pink));filter:blur(22px);z-index:-1;opacity:.9}
@media (prefers-reduced-motion:no-preference){.mark .glow{animation:spin 16s linear infinite}}
.mark .glass{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.mark svg{width:66px;height:66px}
.welcome h1.title{font-size:54px;margin-bottom:10px}
.welcome .sub{font-size:18px;margin-bottom:28px}
.trio{display:flex;gap:16px;margin-bottom:36px}
.welcome .btn{max-width:320px}

/* Bubbles: a colour lit from behind, frosted in front. */
.bubble{position:relative;display:block;width:100%;padding:0;text-align:center;isolation:isolate}
.bubble .glow{position:absolute;left:10%;right:10%;top:4%;bottom:12%;border-radius:50%;background:radial-gradient(circle at 50% 40%,hsl(var(--hue) 96% 66% / .95),hsl(calc(var(--hue) + 45) 96% 70% / .55) 48%,transparent 74%);filter:blur(16px);z-index:-1}
.bubble .glass{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:136px;padding:18px 12px;border-radius:32px}
.bubble .t{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:600;font-size:22px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.bubble .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bubble .ph{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:hsl(var(--hue) 70% 36%);margin-top:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble .ph{color:hsl(var(--hue) 90% 74%)}}
:root[data-theme="dark"] .bubble .ph{color:hsl(var(--hue) 90% 74%)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}

.orbrow{display:flex;justify-content:center;gap:14px;margin:22px 0 26px}
.orb{display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;isolation:isolate;padding:0;width:98px;text-align:center}
.orb .glow{position:absolute;left:12px;right:12px;top:-4px;height:96px;border-radius:50%;background:radial-gradient(circle,hsl(var(--hue) 96% 66% / .95),transparent 70%);filter:blur(14px);z-index:-1}
.orb .glass{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.orb .glass svg{width:30px;height:30px}
.orb .l{font-size:13px;font-weight:600}
.orb .badge{position:absolute;top:-2px;right:8px}
.trio .orb{width:78px}.trio .orb .glass{width:66px;height:66px}.trio .orb .glass svg{width:24px;height:24px}.trio .orb .glow{height:72px;top:-3px}

/* The one loud element. */
.sky{position:relative;isolation:isolate;display:block;width:100%;padding:0;text-align:center;margin-bottom:6px}
.sky .glow{position:absolute;inset:-4% 8% 8% 8%;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--c),transparent 70%);filter:blur(30px);z-index:-1;opacity:.9}
.sky .glass{display:block;border-radius:32px;padding:24px 20px 18px;color:var(--ink)}
.sky.warn .glass{background:linear-gradient(160deg,var(--warn),var(--warn-2));color:#fff;border-color:transparent;box-shadow:0 16px 44px rgba(244,63,94,.35)}
.sky.watch .glass{background:linear-gradient(160deg,var(--watch),var(--watch-2));color:var(--watch-ink);border-color:transparent;box-shadow:0 16px 44px rgba(255,176,59,.35)}
.sky .eyebrow{color:inherit;opacity:.72;margin:0 0 8px}
.sky h2{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-optical-sizing:auto;font-size:34px;line-height:1.04;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
.sky p{margin:8px auto 0;font-size:15px;line-height:1.4;max-width:30ch;opacity:.9}
.sky .strip{display:flex;gap:6px;margin-top:18px}
.sky .strip .c{flex:1;min-width:0;border-radius:14px;padding:8px 2px 7px;font-size:11px;line-height:1.2;background:rgba(255,255,255,.5)}
.sky.warn .strip .c{background:rgba(255,255,255,.18)}
.sky.watch .strip .c{background:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sky.ok .strip .c,:root:not([data-theme="light"]) .sky.none .strip .c{background:rgba(255,255,255,.08)}}
:root[data-theme="dark"] .sky.ok .strip .c,:root[data-theme="dark"] .sky.none .strip .c{background:rgba(255,255,255,.08)}
.sky .strip svg{width:22px;height:22px;margin:4px auto 3px;display:block}
.sky .strip b{display:block;font-size:14px;font-weight:600}
.sky .foot{display:block;margin-top:14px;font-size:12px;opacity:.72}
@media (prefers-reduced-motion:no-preference){
  .sky.warn .glass::after{content:"";position:absolute;inset:0;border-radius:32px;border:2px solid #fff;opacity:0;animation:pulse 1.8s ease-out infinite;pointer-events:none}
  @keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.035)}}
}
.sk{background:rgba(255,255,255,.45);border-radius:14px}
@media (prefers-reduced-motion:no-preference){
  .sk{background:linear-gradient(90deg,rgba(255,255,255,.35) 25%,rgba(255,255,255,.7) 40%,rgba(255,255,255,.35) 60%);background-size:300% 100%;animation:shimmer 1.4s ease infinite}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
}

/* Alerts */
.alert{display:flex;gap:14px;width:100%;padding:14px 16px 14px 14px;position:relative;align-items:center}
.alert+.alert::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.alert .bar{width:5px;border-radius:3px;flex:none;align-self:stretch}
.alert .bar.warn{background:var(--warn)} .alert .bar.watch{background:var(--watch)}
.alert .main{flex:1;min-width:0}
.alert .t{font-weight:600;font-size:17px;line-height:1.25}
.alert .s{color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.alerthead{border-radius:32px;padding:26px 20px 22px;margin-bottom:14px;text-align:center;color:#fff}
.alerthead.watch{background:linear-gradient(160deg,var(--watch),var(--watch-2));color:var(--watch-ink);box-shadow:0 16px 44px rgba(255,176,59,.35)}
.alerthead.warn{background:linear-gradient(160deg,var(--warn),var(--warn-2));box-shadow:0 16px 44px rgba(244,63,94,.35)}
.alerthead .eyebrow{color:inherit;opacity:.8;margin:0 0 8px}
.alerthead h2{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:34px;line-height:1.04;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
.alerthead p{margin-top:8px;font-size:15px;opacity:.9}
.todo{display:flex;gap:12px;align-items:flex-start;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.todo .ic{width:36px;height:36px;border-radius:50%;background:rgba(23,179,122,.18);color:var(--ok);display:grid;place-items:center;flex:none}
.todo .ic svg{width:20px;height:20px}
.todo .t{font-weight:700;margin-bottom:2px}
.todo p{font-size:15px;line-height:1.45}
.kv{display:flex;gap:12px;padding:12px 16px;position:relative;font-size:15px}
.kv+.kv::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.kv .k{color:var(--muted);flex:none;width:92px}
.kv .v{flex:1;line-height:1.45}
.body{font-size:16px;line-height:1.5;margin-bottom:14px;color:var(--ink-2);padding:0 4px}

/* Forecast */
.chart{position:relative;border-radius:var(--radius);padding:14px 10px 6px;margin-bottom:12px}
.chart .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 6px 6px;text-align:center}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart .tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));display:none;z-index:2}
.chart .tip b{font-weight:700}
.hours{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gutter) 12px;margin:0 calc(-1 * var(--gutter)) 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:66px;border-radius:18px;padding:10px 4px;text-align:center;scroll-snap-align:start}
.hr.now{background:rgba(155,123,255,.22)}
.hr .tm{font-size:12px;color:var(--muted)}
.hr svg{width:24px;height:24px;margin:7px auto 5px;display:block}
.hr .tp{font-weight:700;font-size:16px}
.hr .pp{font-size:11px;color:var(--rain);margin-top:2px;font-weight:700}

/* Radar */
.rmap{position:relative;width:100%;aspect-ratio:1;border-radius:30px;overflow:hidden;background:var(--map);margin-bottom:10px;box-shadow:var(--shadow)}
.rmap .stage{position:absolute;left:0;top:0;width:512px;height:512px;transform-origin:0 0}
.rmap .tile{position:absolute;filter:saturate(.5) brightness(.8) contrast(1.05)}
.rmap .frame{position:absolute;left:0;top:0;width:512px;height:512px;opacity:0;transition:opacity .12s linear}
.rmap .frame.on{opacity:.82}
@media (prefers-reduced-motion:reduce){.rmap .frame{transition:none}}
.rmap .pin{position:absolute;left:256px;top:256px;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #FF5FA8,0 0 0 10px rgba(255,95,168,.28)}
.rmap .pinlabel{position:absolute;left:256px;top:272px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#1A1533;font-size:22px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap}
.rmap .stamp{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:#1A1533;border-radius:16px;padding:8px 12px 7px;line-height:1.1;text-align:left}
.rmap .stamp b{display:block;font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.rmap .stamp span{font-size:12px;color:#555}
.rmap .legend{position:absolute;right:12px;bottom:14px;background:rgba(255,255,255,.94);color:#1A1533;border-radius:999px;font-size:12px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.rmap .legend i{display:block;width:56px;height:8px;border-radius:999px;background:linear-gradient(90deg,#2fb04a,#ffe600,#f2a900,#c8102e,#a020a0)}
.rmap .progress{position:absolute;left:0;bottom:0;height:3px;background:var(--grad);width:0;transition:width .25s}
.rmap .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#fff;font-size:15px}
.rctl{display:flex;align-items:center;gap:12px;margin:2px 0 0}
.play{width:50px;height:50px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(155,123,255,.4)}
.play svg{width:20px;height:20px}
.scrubwrap{flex:1;min-width:0}
input[type=range].scrub{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range].scrub::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(155,123,255,.28)}
input[type=range].scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--grad);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-top:-9px}
input[type=range].scrub::-moz-range-track{height:6px;border-radius:3px;background:rgba(155,123,255,.28)}
input[type=range].scrub::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff}
.ticks{display:flex;justify-content:space-between;padding:0 6px 0 68px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin:-6px 0 14px}

.field{display:flex;align-items:center;gap:10px;padding:12px 16px}
.field input{flex:1;border:0;background:none;outline:none;min-width:0}
.field .k{color:var(--muted);font-size:14px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.link{color:var(--accent);font-weight:600;text-decoration:none}

/* Touch feel: squish on press, spring back on release, and the light behind it flares. */
.bubble>.glass,.orb>.glass,.sky>.glass,.mark>.glass,.btn,.tb,.play,button.row,button.alert{transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,background-color .16s;will-change:transform}
.bubble>.glow,.orb>.glow,.sky>.glow{transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .22s,opacity .22s}
.pressed>.glass,.btn.pressed,.tb.pressed,.play.pressed,button.row.pressed,button.alert.pressed{transform:scale(.94)}
.pressed>.glow{transform:scale(1.14);filter:blur(12px);opacity:1}
button.row.pressed,button.alert.pressed{background:rgba(255,255,255,.35)}
@media (prefers-reduced-motion:no-preference){
  .pop>.glass,.btn.pop,.tb.pop,.play.pop,button.row.pop,button.alert.pop{animation:pop .42s cubic-bezier(.2,.8,.2,1)}
  .pop>.glow{animation:flare .55s ease-out}
  @keyframes pop{0%{transform:scale(.94)}45%{transform:scale(1.045)}72%{transform:scale(.99)}100%{transform:scale(1)}}
  @keyframes flare{0%{transform:scale(1.14);opacity:1;filter:blur(12px)}100%{transform:scale(1);opacity:.95;filter:blur(16px)}}
}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i><i class="o5"></i></div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Fieldwatch on the web. Same festivals, same sources and the same data shapes as the iPhone app:
// the backend when one is configured, otherwise the National Weather Service and the NEXRAD archive
// straight from the browser. Everything fetched is cached, so the last good data shows when signal drops.
const NWS = 'https://api.weather.gov';
const IEM_WMS = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q-t.cgi';
const OSM = 'https://tile.openstreetmap.org';
const ATTRIBUTION = 'NOAA NEXRAD via Iowa Environmental Mesonet';
const HOURS = 12, DIRECT_STEP_MIN = 15, LAG_MIN = 10, HALF_M = 160000, SIZE = 512, R = 6378137;
const DAY = 86400000;
// Inside a Claude artifact preview the browser is not allowed to reach outside hosts.
const IN_PREVIEW = !!(window.claude && typeof window.claude.use === 'function');
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const S = { screen: 'welcome', param: null, stack: [], fest: null, cache: {}, backend: '', busy: false, query: '', welcomed: false };
let FESTS = [];
const STORE = 'fieldwatch.web';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE) || '{}'); Object.assign(S, { fest: d.fest || null, cache: d.cache || {}, backend: d.backend || '', welcomed: !!d.welcomed }); }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({ fest: S.fest, cache: S.cache, backend: S.backend, welcomed: S.welcomed })); }catch(e){}
}
const backend = () => (new URLSearchParams(location.search).get('backend') || S.backend || '').replace(/\/+$/, '');
const fest = () => FESTS.find(f => f.id === S.fest);
const data = f => S.cache[f.id] || {};
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// ---- time --------------------------------------------------------------------------------------------
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtHour = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric' }).replace(/\s/g, ' ');
const fmtDay = iso => new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtWhen = iso => new Date(iso).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const fmtFull = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function ago(iso){
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 6) / 10;
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago';
}
// End stamps sit at local midnight after the last day, so nudge back six hours before naming the day.
const lastDay = f => new Date(Date.parse(f.endDate) - 6 * 3600000);
const fmtRange = f => { const a = fmtDay(f.startDate), b = fmtDay(lastDay(f)); return a === b ? a : `${a} – ${b}`; };
function phase(f, now = Date.now()){
  const start = Date.parse(f.startDate), end = Date.parse(f.endDate);
  if (now > end) return { key: 'ended', text: 'Ended' };
  if (now >= start - 3 * DAY) {
    if (now >= start) return { key: 'now', text: 'Happening now' };
    const d = Math.ceil((start - now) / DAY);
    return { key: 'now', text: d <= 1 ? 'Starts tomorrow' : `Starts in ${d} days` };
  }
  const d = Math.round((start - now) / DAY);
  return { key: d <= 14 ? 'soon' : 'later', text: `In ${d} days` };
}

// ---- weather data (mirrors backend/src/nws.js and NWSClient.swift) ---------------------------------
async function getJSON(url, headers){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(url, { headers: headers || {}, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const GEO = { Accept: 'application/geo+json' };
const pt = f => `${f.latitude.toFixed(4)},${f.longitude.toFixed(4)}`;
const normalizeAlert = ft => { const p = ft.properties; return {
  id: p.id, event: p.event, headline: p.headline ?? null, body: p.description ?? '', instruction: p.instruction ?? null,
  severity: String(p.severity || 'Unknown').toLowerCase(), area: p.areaDesc ?? '', source: p.senderName ?? 'National Weather Service',
  issuedAt: p.effective, expiresAt: p.ends ?? p.expires ?? null, channel: 'weather', relayCount: 0 }; };
const isWarning = a => a.severity === 'severe' || a.severity === 'extreme';
const isActive = a => !a.expiresAt || Date.parse(a.expiresAt) > Date.now();
const activeAlerts = f => (data(f).alerts || []).filter(isActive).sort((a, b) => (isWarning(b) - isWarning(a)));
const level = f => { const al = activeAlerts(f); return al.some(isWarning) ? 'warn' : al.length ? 'watch' : 'ok'; };

async function loadAlerts(f){
  const b = backend();
  if (b) { try { return await getJSON(`${b}/festivals/${f.id}/alerts`); } catch(e) {} }   // fall back to NWS, like the app
  const fc = await getJSON(`${NWS}/alerts/active?point=${pt(f)}`, GEO);
  return (fc.features || []).map(normalizeAlert);
}
async function loadHourly(f){
  const point = await getJSON(`${NWS}/points/${pt(f)}`, GEO);
  const fc = await getJSON(point.properties.forecastHourly, GEO);
  return fc.properties.periods.slice(0, 36).map(x => ({ startTime: x.startTime, temperature: x.temperature, shortForecast: x.shortForecast, windSpeed: x.windSpeed, precipChance: x.probabilityOfPrecipitation?.value ?? null }));
}

/** Pull everything for the chosen festival. Whatever succeeds replaces the cache; whatever fails leaves the last good copy. */
async function refresh(f){
  if (!f || S.busy) return;
  S.busy = true; render();
  const b = backend();
  const [al, hr, po, inc] = await Promise.allSettled([
    loadAlerts(f), loadHourly(f),
    b ? getJSON(`${b}/festivals/${f.id}/posts`) : Promise.resolve(data(f).posts || []),
    b ? getJSON(`${b}/festivals/${f.id}/incidents`) : Promise.resolve(null),
  ]);
  const next = { ...data(f) };
  let ok = false;
  if (al.status === 'fulfilled') { next.alerts = al.value; ok = true; }
  if (hr.status === 'fulfilled') { next.hourly = hr.value; ok = true; }
  if (po.status === 'fulfilled') next.posts = po.value;
  if (inc.status === 'fulfilled') next.incidents = inc.value;
  next.checkedAt = new Date().toISOString();
  if (ok) { next.at = next.checkedAt; next.error = null; }
  else next.error = (al.reason && al.reason.message) || (hr.reason && hr.reason.message) || 'unreachable';
  S.cache[f.id] = next; S.busy = false; save(); render();
}

// ---- radar (mirrors backend/src/radar.js) --------------------------------------------------------------
const mercator = (lat, lon) => ({ x: R * lon * Math.PI / 180, y: R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) });
function coverage(f){ const c = mercator(f.latitude, f.longitude); return [c.x - HALF_M, c.y - HALF_M, c.x + HALF_M, c.y + HALF_M]; }
const isoMin = t => new Date(t).toISOString().replace(/\.\d{3}Z$/, 'Z');
function iemURL(bbox, t){
  const p = new URLSearchParams({ SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap', LAYERS: 'nexrad-n0q-wmst', STYLES: '', SRS: 'EPSG:3857',
    BBOX: bbox.map(n => n.toFixed(0)).join(','), WIDTH: SIZE, HEIGHT: SIZE, FORMAT: 'image/png', TRANSPARENT: 'true', TIME: isoMin(t) });
  return `${IEM_WMS}?${p}`;
}
async function radarLoop(f){
  const b = backend(), bbox = coverage(f);
  if (b) {
    const m = await getJSON(`${b}/festivals/${f.id}/radar`);
    return { bbox, frames: m.frames.map(x => ({ time: x.time, url: /^https?:/.test(x.url) ? x.url : b + x.url })), attribution: m.attribution, hours: m.hours, step: m.stepMinutes };
  }
  // Straight from the archive: 12 hours at 15-minute steps, newest at least 10 minutes old (composites land late).
  const step = DIRECT_STEP_MIN * 60000, newest = Math.floor((Date.now() - LAG_MIN * 60000) / step) * step, frames = [];
  for (let t = newest - HOURS * 3600000 + step; t <= newest; t += step) frames.push({ time: isoMin(t), url: iemURL(bbox, t) });
  return { bbox, frames, attribution: ATTRIBUTION, hours: HOURS, step: DIRECT_STEP_MIN };
}
/** OpenStreetMap tiles under the radar square, placed in the same Web Mercator metres. Zoom 8 is about 610 m per pixel. */
function tiles(bbox){
  const z = 8, world = 40075016.686, tileM = world / 2 ** z, mpp = (bbox[2] - bbox[0]) / SIZE, out = [];
  const tx0 = Math.floor((bbox[0] + world / 2) / tileM), tx1 = Math.floor((bbox[2] + world / 2) / tileM);
  const ty0 = Math.floor((world / 2 - bbox[3]) / tileM), ty1 = Math.floor((world / 2 - bbox[1]) / tileM);
  for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
    out.push({ url: `${OSM}/${z}/${tx}/${ty}.png`, left: (tx * tileM - world / 2 - bbox[0]) / mpp, top: (bbox[3] - (world / 2 - ty * tileM)) / mpp, size: tileM / mpp });
  }
  return out;
}

const radar = { frames: [], loaded: new Set(), failed: 0, index: 0, playing: true, timer: 0, loop: null };
function stopRadar(){ clearTimeout(radar.timer); radar.timer = 0; radar.frames = []; radar.loaded.clear(); radar.failed = 0; radar.loop = null; }
async function startRadar(f){
  stopRadar();
  let loop;
  try { loop = await radarLoop(f); } catch(e) { radar.loop = { error: e.message || 'unreachable', frames: [] }; render(); return; }
  if (S.screen !== 'radar') return;
  radar.loop = loop; radar.frames = loop.frames; radar.index = loop.frames.length - 1; radar.playing = true;
  render();
  fitStage();
  // Newest first, so the present shows while the past fills in.
  loop.frames.map((fr, i) => i).reverse().forEach(i => {
    const img = document.getElementById('fr' + i); if (!img) return;
    img.onload = () => { radar.loaded.add(i); if (radar.loaded.size === 1) { radar.index = i; showFrame(); tick(); } updateRadarNote(); };
    img.onerror = () => { radar.failed++; updateRadarNote(); };
    img.src = loop.frames[i].url;
  });
}
function nextLoaded(from){
  const n = radar.frames.length;
  for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (radar.loaded.has(i)) return i; }
  return from;
}
function tick(){
  clearTimeout(radar.timer);
  if (!radar.playing || !radar.frames.length) return;
  const last = radar.index === Math.max(...radar.loaded);
  radar.timer = setTimeout(() => { if (!radar.playing) return; radar.index = nextLoaded(radar.index); showFrame(); tick(); }, last ? 1500 : 120);
}
function showFrame(){
  document.querySelectorAll('.frame').forEach((el, i) => el.classList.toggle('on', i === radar.index));
  const fr = radar.frames[radar.index]; const t = document.getElementById('radar-time'), a = document.getElementById('radar-ago'), sl = document.getElementById('radar-slider');
  if (fr && t) { t.textContent = fmtTime(fr.time); a.textContent = ago(fr.time); }
  if (sl) sl.value = radar.index;
}
function radarScrub(v){ radar.playing = false; clearTimeout(radar.timer); radar.index = +v; showFrame(); updatePlay(); }
function radarToggle(){ radar.playing = !radar.playing; updatePlay(); if (radar.playing) tick(); else clearTimeout(radar.timer); }
function updatePlay(){ const b = document.getElementById('radar-play'); if (!b) return; b.innerHTML = radar.playing ? I.pause : I.play; b.setAttribute('aria-label', radar.playing ? 'Pause' : 'Play'); }
function updateRadarNote(){
  const total = radar.frames.length, got = radar.loaded.size;
  const bar = document.getElementById('radar-progress'); if (bar) bar.style.width = total ? `${Math.round(100 * (got + radar.failed) / total)}%` : '0';
  if (bar && got + radar.failed >= total) setTimeout(() => { bar.style.opacity = '0'; }, 400);
  const n = document.getElementById('radar-loaded'); if (!n) return;
  n.textContent = got === total ? '' : radar.failed === total
    ? (IN_PREVIEW ? 'This preview cannot reach the radar archive. Open the hosted build to see it live.' : 'Cannot reach the radar archive right now.')
    : `Loading ${got} of ${total} frames`;
}
function fitStage(){
  const box = document.getElementById('rmap'), st = document.getElementById('stage');
  if (box && st) st.style.transform = `scale(${box.clientWidth / SIZE})`;
}
window.addEventListener('resize', fitStage);

// ---- touch feel ----------------------------------------------------------------------------------------------
const MOTION = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PRESSABLE = '.bubble, .orb, .sky, .btn, .tb, .play, button.row, button.alert';
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {} };
let pressedEl = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest(PRESSABLE); if (!el || el.disabled) return;
  pressedEl = el; el.classList.add('pressed'); buzz(8);
}, { passive: true });
function release(e){
  const el = pressedEl; if (!el) return; pressedEl = null;
  el.classList.remove('pressed');
  if (e.type === 'pointerup' && MOTION) {
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true });
  }
}
document.addEventListener('pointerup', release, { passive: true });
document.addEventListener('pointercancel', release, { passive: true });
/** Let the spring play before the screen changes. */
const later = fn => setTimeout(fn, MOTION ? 160 : 0);

// ---- navigation ------------------------------------------------------------------------------------------
function go(name, param, opts){
  opts = opts || {};
  stopRadar();
  if (!opts.replace) S.stack.push({ name: S.screen, param: S.param });
  if (opts.reset) S.stack = [];
  S.screen = name; S.param = param || null;
  render(false); window.scrollTo(0, 0);
  if (name === 'radar' && fest()) startRadar(fest());
}
function back(){
  stopRadar();
  const p = S.stack.pop();
  if (!p) { S.screen = S.fest ? 'home' : 'picker'; S.param = null; }
  else { S.screen = p.name; S.param = p.param; }
  render(true); window.scrollTo(0, 0);
}
function pick(id){ later(() => { S.fest = id; save(); go('home', null, { reset: true }); refresh(fest()); }); }
function changeFestival(){ S.fest = null; save(); go('picker', null, { reset: true }); }

// ---- icons: one stroke family, 1.9px, rounded ------------------------------------------------------------
const svg = (body, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
const I = {
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  chev: svg('<path d="M9 5l7 7-7 7"/>', 'class="chev"'),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  refresh: svg('<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  radar: svg('<path d="M12 12L19 5"/><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7a5 5 0 1 0 5 5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
  bell: svg('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  chart: svg('<path d="M3 17l5-6 4 3 4-6 5 4"/><path d="M3 21h18"/>'),
  shield: svg('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v4M12 15h.01"/>'),
  megaphone: svg('<path d="M3 10v4a1 1 0 0 0 1 1h3l5 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>'),
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  share: svg('<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
  cloud: svg('<path d="M17.5 19a4.5 4.5 0 0 0 .5-9 7 7 0 0 0-13.4 2A4 4 0 0 0 6 19z"/>'),
  partly: svg('<path d="M6 16a4 4 0 0 1 .6-7.9A6 6 0 0 1 18 10a3.5 3.5 0 0 1-.5 7z"/><path d="M12 2v1.5M5 5l1 1M19 5l-1 1"/>'),
  rain: svg('<path d="M17.5 16a4.5 4.5 0 0 0 .5-9 7 7 0 0 0-13.4 2A4 4 0 0 0 6 16z"/><path d="M8 19v2M12 18v3M16 19v2"/>'),
  storm: svg('<path d="M17.5 15a4.5 4.5 0 0 0 .5-9 7 7 0 0 0-13.4 2A4 4 0 0 0 6 15z"/><path d="M13 13l-2 4h3l-2 4"/>'),

function glyph(h){
  const s = (h.shortForecast || '').toLowerCase(), hour = new Date(h.startTime).getHours(), night = hour < 6 || hour >= 20;
  if (s.includes('thunder')) return I.storm;
  if (s.includes('snow') || s.includes('sleet') || s.includes('ice')) return I.snow;
  if (s.includes('rain') || s.includes('shower') || s.includes('drizzle')) return I.rain;
  if (s.includes('fog') || s.includes('haze') || s.includes('smoke')) return I.fog;
  if (s.includes('windy') || s.includes('breezy')) return I.wind;
  if (s.includes('partly') || s.includes('mostly sunny') || s.includes('mostly clear')) return night ? I.moon : I.partly;
  if (s.includes('cloud') || s.includes('overcast')) return I.cloud;
  return night ? I.moon : I.sun;
}

// ---- forecast chart: two aligned panels, one measure each ---------------------------------------------
function chartSVG(hours){
  const W = 360, PADL = 30, PADR = 10, TOP = 22, TH = 92, GAP = 22, RH = 44, BOT = 22;
  const rainy = hours.some(h => (h.precipChance || 0) > 0);
  const H = TOP + TH + (rainy ? GAP + RH : 0) + BOT;
  const n = hours.length, x = i => PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1));
  const temps = hours.map(h => h.temperature), tmin = Math.min(...temps), tmax = Math.max(...temps);
  const lo = Math.floor((tmin - 3) / 5) * 5, hi = Math.ceil((tmax + 3) / 5) * 5;
  const y = t => TOP + TH - (t - lo) / (hi - lo) * TH;
  const pts = temps.map((t, i) => [x(i), y(t)]);
  // Catmull-Rom through the hourly points, so the curve passes through every reading.
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${d} L${pts.at(-1)[0].toFixed(1)},${TOP + TH} L${pts[0][0].toFixed(1)},${TOP + TH} Z`;
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${PADL}" x2="${W - PADR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${PADL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v)}°</text>`).join('');
  const iMax = temps.indexOf(tmax), iMin = temps.indexOf(tmin);
  const label = (i, v, above) => {
    const edge = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle', dx = i === 0 ? 9 : i === n - 1 ? -9 : 0;
    return `<text x="${(x(i) + dx).toFixed(1)}" y="${(y(v) + (edge === 'middle' ? (above ? -10 : 16) : 4)).toFixed(1)}" text-anchor="${edge}" font-size="11" font-weight="600" fill="var(--ink)">${Math.round(v)}°</text>`;
  };
  const marks = `<circle cx="${x(iMax).toFixed(1)}" cy="${y(tmax).toFixed(1)}" r="4" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/>${label(iMax, tmax, true)}`
    + (iMin !== iMax ? `<circle cx="${x(iMin).toFixed(1)}" cy="${y(tmin).toFixed(1)}" r="4" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/>${label(iMin, tmin, false)}` : '')
    + `<circle cx="${x(0).toFixed(1)}" cy="${y(temps[0]).toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--temp)" stroke-width="2.5"/>`;
  const labelsY = H - 6;
  const xlabels = hours.map((h, i) => i % 3 === 0 ? `<text x="${x(i).toFixed(1)}" y="${labelsY}" text-anchor="${i === 0 ? 'start' : 'middle'}" font-size="10" fill="var(--muted)">${i === 0 ? 'Now' : esc(fmtHour(h.startTime))}</text>` : '').join('');
  let rain = '';
  if (rainy) {
    const top = TOP + TH + GAP, base = top + RH, bw = Math.max(3, (W - PADL - PADR) / n - 2), rmax = Math.max(...hours.map(h => h.precipChance || 0));
    rain = `<text x="${PADL}" y="${top - 7}" font-size="10" font-weight="600" fill="var(--muted)">CHANCE OF RAIN</text><line x1="${PADL}" x2="${W - PADR}" y1="${base}" y2="${base}" stroke="var(--line)"/>`
      + hours.map((h, i) => { const v = h.precipChance || 0; if (!v) return ''; const hh = Math.max(3, RH * v / 100); return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(base - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="var(--rain)"/>`; }).join('')
      + (rmax ? `<text x="${x(hours.findIndex(h => (h.precipChance || 0) === rmax)).toFixed(1)}" y="${(base - RH * rmax / 100 - 5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${rmax}%</text>` : '');
  }
  return `<svg viewBox="0 0 ${W} ${H}" id="chart" data-n="${n}" role="img" aria-label="Temperature for the next ${n} hours, ${Math.round(tmin)} to ${Math.round(tmax)} degrees${rainy ? ', with chance of rain' : ''}">
    <defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--temp)" stop-opacity=".28"/><stop offset="1" stop-color="var(--temp)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#tg)"/><path d="${d}" fill="none" stroke="var(--temp)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>${marks}${rain}${xlabels}
    <g id="xh" style="display:none"><line id="xh-line" y1="${TOP - 6}" y2="${H - BOT + 4}" stroke="var(--ink)" stroke-opacity=".35" stroke-dasharray="3 3"/><circle id="xh-dot" r="5" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/></g>
  </svg>`;
}
function chartHover(){
  const svgEl = document.getElementById('chart'), tip = document.getElementById('tip'); if (!svgEl || !tip) return;
  const hours = (data(fest()).hourly || []).slice(0, 24), n = hours.length, PADL = 30, PADR = 10, W = 360;
  const at = clientX => {
    const r = svgEl.getBoundingClientRect(), fx = (clientX - r.left) / r.width * W;
    return Math.max(0, Math.min(n - 1, Math.round((fx - PADL) / (W - PADL - PADR) * (n - 1))));
  };
  const show = (e) => {
    const i = at(e.clientX), h = hours[i]; if (!h) return;
    const g = document.getElementById('xh'), r = svgEl.getBoundingClientRect(), x = PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1));
    const temps = hours.map(q => q.temperature), lo = Math.floor((Math.min(...temps) - 3) / 5) * 5, hi = Math.ceil((Math.max(...temps) + 3) / 5) * 5;
    const yy = 22 + 92 - (h.temperature - lo) / (hi - lo) * 92;
    g.style.display = ''; document.getElementById('xh-line').setAttribute('x1', x); document.getElementById('xh-line').setAttribute('x2', x);
    const dot = document.getElementById('xh-dot'); dot.setAttribute('cx', x); dot.setAttribute('cy', yy);
    tip.innerHTML = `<b>${esc(i === 0 ? 'Now' : fmtHour(h.startTime))}</b> ${Math.round(h.temperature)}° · ${esc(h.shortForecast)}${h.precipChance ? ` · ${h.precipChance}%` : ''}`;
    tip.style.display = 'block'; tip.style.left = `${(x / W) * r.width + (r.left - svgEl.parentElement.getBoundingClientRect().left)}px`; tip.style.top = `${(yy / (+svgEl.getAttribute('viewBox').split(' ')[3])) * r.height + (r.top - svgEl.parentElement.getBoundingClientRect().top)}px`;
  };
  const hide = () => { tip.style.display = 'none'; const g = document.getElementById('xh'); if (g) g.style.display = 'none'; };
  svgEl.addEventListener('pointerdown', show); svgEl.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
  svgEl.addEventListener('pointerup', hide); svgEl.addEventListener('pointerleave', hide); svgEl.addEventListener('pointercancel', hide);
}

// ---- alert text: NWS bullets become sections -----------------------------------------------------------------
function parseNWS(text){
  const parts = String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const sections = [], paragraphs = [];
  for (const p of parts) {
    const m = p.match(/^\*\s*([A-Z][A-Z /]+?)\.{2,}\s*(.*)$/);
    if (m) sections.push({ label: m[1].charAt(0) + m[1].slice(1).toLowerCase(), text: m[2] }); else paragraphs.push(p);
  }
  return { sections, paragraphs };
}
/** One line about the next hours, from the forecast itself. */
function outlook(f){
  const hr = (data(f).hourly || []).slice(0, 12); if (!hr.length) return '';
  const storm = hr.find(h => /thunder/i.test(h.shortForecast || ''));
  if (storm) return `Thunderstorms possible around ${fmtHour(storm.startTime)}.`;
  const wet = hr.find(h => (h.precipChance || 0) >= 50);
  if (wet) return `Rain likely around ${fmtHour(wet.startTime)}.`;
  const some = hr.find(h => (h.precipChance || 0) >= 25);
  if (some) return `A chance of rain from ${fmtHour(some.startTime)}.`;
  return 'Dry for the next 12 hours.';
}

    <div class="rctl">
      <button class="play" id="radar-play" onclick="radarToggle()" aria-label="Pause">${I.pause}</button>
      <div class="scrubwrap"><input type="range" class="scrub" id="radar-slider" min="0" max="${Math.max(n - 1, 0)}" value="${Math.max(n - 1, 0)}" oninput="radarScrub(this.value)" aria-label="Scrub through the last ${HOURS} hours"></div>
    </div>
    <div class="ticks" aria-hidden="true"><span>${tickAt(0)}</span><span>${tickAt(.25)}</span><span>${tickAt(.5)}</span><span>${tickAt(.75)}</span><span>${tickAt(1)}</span></div>
    <p class="note" id="radar-loaded"></p>
    <p class="note">${esc(loop.attribution)} · Map © OpenStreetMap contributors</p>`;
  return topbar(backBtn(), '', '') + `<span class="eyebrow">${esc(f.county)}</span><h1 class="title">Radar</h1><p class="sub">Last ${HOURS} hours, 160 km around ${esc(f.name)}</p>${body}`;
};

screens.alert = id => {
  const f = fest(); const a = (data(f).alerts || []).find(x => x.id === id);
  if (!a) return topbar(backBtn(), '', '') + `<div class="empty"><b>Alert expired</b>It's no longer in effect.</div>`;
  const warn = isWarning(a), { sections, paragraphs } = parseNWS(a.body);
  const instruction = (a.instruction || '').replace(/\s+/g, ' ').trim();
  return topbar(backBtn(), '', navigator.share ? `<button class="tb glass icon" onclick="share('${esc(a.id)}')" aria-label="Share">${I.share}</button>` : '') + `
    <div class="alerthead ${warn ? 'warn' : 'watch'}"><span class="eyebrow">${warn ? 'Warning' : 'Advisory'}</span><h2>${esc(a.event)}</h2><p>${a.expiresAt ? 'Until ' + esc(fmtFull(a.expiresAt)) : esc(a.area)}</p></div>
    ${instruction ? `<div class="todo glass"><span class="ic">${I.check}</span><div><div class="t">What to do</div><p>${esc(instruction)}</p></div></div>` : ''}
    ${sections.length ? `<div class="group glass">${sections.map(s => `<div class="kv"><span class="k">${esc(s.label)}</span><span class="v">${esc(s.text)}</span></div>`).join('')}</div>` : ''}
    ${paragraphs.map(p => `<p class="body">${esc(p)}</p>`).join('')}
    <div class="group glass">
      <div class="kv"><span class="k">Area</span><span class="v">${esc(a.area)}</span></div>
      <div class="kv"><span class="k">Source</span><span class="v">${esc(a.source)}</span></div>
      <div class="kv"><span class="k">Issued</span><span class="v num">${esc(fmtFull(a.issuedAt))}</span></div>
      ${a.expiresAt ? `<div class="kv"><span class="k">Ends</span><span class="v num">${esc(fmtFull(a.expiresAt))}</span></div>` : ''}
    </div>
    <p class="note">Saved on this phone. Opens without signal.</p>`;
};

screens.official = () => {
  const f = fest(); if (!f) return screens.picker();
  const posts = data(f).posts || [];
  return topbar(backBtn(), '', '') + `
    <span class="eyebrow">${esc(f.name)}</span>
    <h1 class="title">Festival official</h1>
    ${f.isPartner ? (posts.length ? `<p class="h">Updates</p><div class="group glass">${posts.map(p => `<div class="row" style="align-items:flex-start"><div class="main"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.body)}</div><div class="s num" style="font-size:13px">${esc(fmtFull(p.postedAt))}</div></div></div>`).join('')}</div>` : '<div class="card glass"><h3>Nothing posted yet</h3></div>')
                 : `<div class="card glass" style="margin-top:14px"><h3>Not joined yet</h3><p>Staff updates and evacuation notices show up here once the festival signs on.</p></div>`}
    ${(f.site || []).length ? `<p class="h">On site</p><div class="group glass">${f.site.map(s => `<div class="row"><div class="main"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.detail)}</div></div></div>`).join('')}</div>` : ''}
    <p class="note"><a class="link" href="${esc(f.source)}" target="_blank" rel="noopener">${esc(f.source.replace(/^https?:\/\//, '').replace(/\/.*$/, ''))}</a></p>`;
};

screens.incidents = () => {
  const f = fest(); if (!f) return screens.picker();
  const list = data(f).incidents;
  return topbar(backBtn(), '', refreshBtn()) + `
    <span class="eyebrow">Last 48 hours</span>
    <h1 class="title">Incidents</h1>
    ${!backend() ? `<div class="card glass" style="margin-top:14px"><h3>Needs the backend</h3><p>County dispatch incidents and attendee reports come from the Fieldwatch backend. Set its address in Settings.</p></div>`
      : !list ? `<div class="card glass" style="margin-top:14px"><h3>${S.busy ? 'Checking' : 'Cannot reach the backend'}</h3></div>`
      : !list.length ? `<div class="card glass" style="margin-top:14px"><h3>Nothing reported</h3></div>`
      : `<div class="group glass" style="margin-top:14px">${list.map(i => `<div class="alert"><span class="bar ${i.level === 'warning' ? 'warn' : 'watch'}"></span><div class="main"><div class="t">${esc(i.category)}</div><div class="s">${esc(i.summary)}</div><div class="s num" style="font-size:13px">${esc(fmtFull(i.occurredAt))}${i.location ? ', ' + esc(i.location) : ''}</div></div></div>`).join('')}</div>`}
    <p class="note">Only safety traffic is kept. Names and numbers removed.</p>`;
};

screens.settings = () => topbar(backBtn(), '', '') + `
  <h1 class="title">Settings</h1>
  <p class="h" style="margin-top:22px">Backend</p>
  <div class="group glass"><label class="field"><span class="k">URL</span><input id="backend" value="${esc(S.backend)}" placeholder="https://your-backend.example.com" inputmode="url" autocapitalize="off" autocorrect="off" onchange="setBackend(this.value)"></label></div>
  <p class="note">Optional. Adds pushed alerts, incidents and cached radar.</p>
  ${IOS && !STANDALONE && !IN_PREVIEW ? `<div class="card glass"><h3>Add to Home Screen</h3><p>Share, then "Add to Home Screen". Full screen, with an icon, works with no signal.</p></div>` : ''}
  <div class="group glass"><button class="row" onclick="forget()"><div class="main"><div class="t">Forget saved data</div><div class="s">Festival choice and cached weather</div></div>${I.chev}</button></div>
  <p class="note">Weather and alerts: National Weather Service. Radar: ${esc(ATTRIBUTION)}. Map: OpenStreetMap contributors. No account, no login.</p>`;

function setBackend(v){ S.backend = v.trim().replace(/\/+$/, ''); save(); toast(S.backend ? 'Backend saved' : 'Using NWS directly'); if (fest()) refresh(fest()); }
function forget(){ try{ localStorage.removeItem(STORE); }catch(e){} S.fest = null; S.cache = {}; S.backend = ''; S.stack = []; go('picker', null, { replace: true }); toast('Forgotten'); }

let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
async function share(id){
  const a = (data(fest()).alerts || []).find(x => x.id === id); if (!a) return;
  const text = `${a.event} for ${a.area}. ${a.headline || a.body.slice(0, 200)}`;
  try{ await navigator.share({ title: a.event, text }); }catch(e){ if (e && e.name !== 'AbortError') toast("Couldn't share on this device"); }
}

function render(rev){
  const app = document.getElementById('app');
  const fn = screens[S.screen] || screens.picker;
  app.innerHTML = `<div class="screen in ${rev ? 'rev' : ''}">${fn(S.param)}</div>`;
  if (S.screen === 'radar') { fitStage(); showFrame(); updatePlay(); updateRadarNote(); }
  if (S.screen === 'weather') chartHover();
}

async function boot(){
  load();
  try{ FESTS = await (await fetch('festivals.json', { cache: 'no-cache' })).json(); }catch(e){ FESTS = []; }
  if (S.fest && !fest()) S.fest = null;
  S.screen = !S.welcomed ? 'welcome' : S.fest ? 'home' : 'picker';
  render();
  if (fest()) refresh(fest());
  setInterval(() => { if (fest() && document.visibilityState === 'visible' && !S.busy) refresh(fest()); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => { const d = fest() && data(fest()); if (document.visibilityState === 'visible' && d && d.at && Date.now() - Date.parse(d.at) > 5 * 60000 && !S.busy) refresh(fest()); });
  // The app shell works offline once installed; previews and plain http have no service workers.
  if ('serviceWorker' in navigator && !IN_PREVIEW && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
</script>
</body>
</html>
