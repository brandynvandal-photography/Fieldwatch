<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fieldwatch">
<meta name="description" content="Festival safety alerts: live National Weather Service alerts, hourly forecast and a 12-hour radar loop for the grounds.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,1&display=swap">
<title>Fieldwatch</title>
<style>
:root{
  --bg:#FBFAFF; --ink:#1A1533; --ink-2:#3E3860; --muted:#6F6A8F; --line:rgba(26,21,51,.08);
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.84); --glass-border:rgba(255,255,255,.85);
  --accent:#7B5CF5; --accent-ink:#FFFFFF; --grad:linear-gradient(135deg,#FF5FA8 0%,#9B7BFF 58%,#4FE3FF 135%);
  --ok:#17B37A; --ok-2:#0E9563; --watch:#FFB03B; --watch-2:#F0951C; --watch-ink:#2A1B00; --warn:#F43F5E; --warn-2:#D8264B;
  --rain:#3FA9F5; --temp:#FF7A45; --wind:#1B9E77; --storm:#8B5CF6; --map:#120F26;
  --pink:#FF5FA8; --tang:#FFB03B; --lime:#B8F53D; --cyan:#4FE3FF; --violet:#9B7BFF; --orb-opacity:.62;
  --shadow:0 12px 40px rgba(76,52,150,.14); --shadow-2:0 2px 12px rgba(76,52,150,.09);
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:24px; --gutter:18px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0A16; --ink:#F2EFFF; --ink-2:#CFC9EE; --muted:#A39EC4; --line:rgba(255,255,255,.08);
    --glass:rgba(22,18,42,.5); --glass-2:rgba(22,18,42,.78); --glass-border:rgba(255,255,255,.1);
    --accent:#B29CFF; --accent-ink:#0B0A16; --ok:#22C58A; --ok-2:#15A06E; --watch:#FFB847; --watch-2:#E89A22; --warn:#FF4D6D; --warn-2:#D8264B;
    --rain:#2F8FD6; --temp:#E8682F; --wind:#1FA37A; --storm:#8560EA; --orb-opacity:.85;
    --shadow:0 14px 44px rgba(0,0,0,.45); --shadow-2:0 2px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0A16; --ink:#F2EFFF; --ink-2:#CFC9EE; --muted:#A39EC4; --line:rgba(255,255,255,.08);
  --glass:rgba(22,18,42,.5); --glass-2:rgba(22,18,42,.78); --glass-border:rgba(255,255,255,.1);
  --accent:#B29CFF; --accent-ink:#0B0A16; --ok:#22C58A; --ok-2:#15A06E; --watch:#FFB847; --watch-2:#E89A22; --warn:#FF4D6D; --warn-2:#D8264B;
  --rain:#2F8FD6; --temp:#E8682F; --wind:#1FA37A; --storm:#8560EA; --orb-opacity:.85;
  --shadow:0 14px 44px rgba(0,0,0,.45); --shadow-2:0 2px 12px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left}
input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
input::-webkit-search-decoration,input::-webkit-search-cancel-button{-webkit-appearance:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-optical-sizing:auto}

/* Light behind everything: five slow orbs, blurred, under a frosted page. */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(54px);opacity:var(--orb-opacity);will-change:transform}
.orbs .o1{width:64vw;height:64vw;left:-20vw;top:-14vw;background:radial-gradient(circle,var(--pink),transparent 68%)}
.orbs .o2{width:56vw;height:56vw;right:-18vw;top:6vh;background:radial-gradient(circle,var(--tang),transparent 68%)}
.orbs .o3{width:60vw;height:60vw;left:-16vw;top:46vh;background:radial-gradient(circle,var(--lime),transparent 68%)}
.orbs .o4{width:66vw;height:66vw;right:-22vw;bottom:-16vw;background:radial-gradient(circle,var(--cyan),transparent 68%)}
.orbs .o5{width:52vw;height:52vw;left:24vw;top:28vh;background:radial-gradient(circle,var(--violet),transparent 68%)}
@media (prefers-reduced-motion:no-preference){
  .orbs i{animation:drift 26s ease-in-out infinite alternate}
  .orbs .o2{animation-duration:31s}.orbs .o3{animation-duration:23s}.orbs .o4{animation-duration:35s}.orbs .o5{animation-duration:19s;animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(7vw,-6vh) scale(1.14)}}
}
#app{position:relative;z-index:1}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--glass-border);box-shadow:var(--shadow-2)}

.screen{min-height:100%;max-width:560px;margin:0 auto;padding:0 var(--gutter) calc(48px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){
  .screen.in{animation:rise .26s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:62px;margin:0 calc(-1 * var(--gutter));padding:0 12px;display:flex;align-items:center;justify-content:space-between}
/* Scrolled text fades out under the clock and the buttons instead of colliding with them. */
.topbar::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * env(safe-area-inset-top,0px));bottom:-18px;background:linear-gradient(var(--bg) 0%,var(--bg) 42%,transparent);opacity:.94;z-index:-1;pointer-events:none}
.topbar .side{min-width:92px;display:flex;align-items:center;gap:8px}
.topbar .side.r{justify-content:flex-end}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:42px;min-width:42px;padding:0 14px;border-radius:999px;color:var(--ink);font-weight:600;font-size:15px}
.tb.icon{width:42px;padding:0}
.tb svg{width:20px;height:20px}
.tb[disabled]{opacity:.45}
.tb.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.eyebrow{display:block;text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
h1.title{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-optical-sizing:auto;font-weight:600;font-size:42px;line-height:1.02;letter-spacing:-.015em;text-align:center;text-wrap:balance;margin:0 0 8px}
.sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.4;margin:0 auto 20px;max-width:34ch;text-wrap:balance}
.h{text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.note{text-align:center;font-size:12px;color:var(--muted);margin:-4px auto 22px;line-height:1.5;max-width:36ch}
.group{border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:62px;position:relative}
.row+.row::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
button.row:active{background:rgba(255,255,255,.35)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25}
.row .s{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.3}
.row .tr{text-align:right;color:var(--muted);font-size:12px;flex:none;line-height:1.3}
.row .tr b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.row .lead{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(155,123,255,.18);color:var(--accent)}
.row .lead svg{width:20px;height:20px}
.dotc{width:12px;height:12px;border-radius:50%;flex:none;background:hsl(var(--hue) 92% 62%);box-shadow:0 0 0 4px hsl(var(--hue) 92% 62% / .22)}
.chev{width:18px;height:18px;color:var(--muted);flex:none;opacity:.6}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--warn);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;flex:none;box-shadow:0 2px 8px rgba(244,63,94,.4)}
.card{border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center}
.card h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:600;font-size:22px;line-height:1.1;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px;line-height:1.45;max-width:32ch;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 22px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:17px;box-shadow:0 12px 30px rgba(155,123,255,.38);margin-bottom:12px;text-align:center}
.btn svg{width:22px;height:22px;flex:none}
.btn.quiet{background:var(--glass);color:var(--ink);box-shadow:var(--shadow-2);border:1px solid var(--glass-border)}
.search{display:flex;align-items:center;gap:10px;border-radius:999px;padding:12px 18px;margin-bottom:24px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--muted)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-weight:600}

/* Welcome */
.welcome{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0 30px}
.mark{position:relative;isolation:isolate;width:150px;height:150px;margin-bottom:28px}
.mark .glow{position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(from 0deg,var(--pink),var(--tang),var(--lime),var(--cyan),var(--violet),var(--pink));filter:blur(22px);z-index:-1;opacity:.9}
@media (prefers-reduced-motion:no-preference){.mark .glow{animation:spin 16s linear infinite}}
.mark .glass{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.mark svg{width:66px;height:66px}
.welcome h1.title{font-size:54px;margin-bottom:10px}
.welcome .sub{font-size:18px;margin-bottom:28px}
.trio{display:flex;gap:16px;margin-bottom:36px}
.welcome .btn{max-width:320px}

/* Bubbles: a colour lit from behind, frosted in front. */
.bubble{position:relative;display:block;width:100%;padding:0;text-align:center;isolation:isolate}
.bubble .glow{position:absolute;left:10%;right:10%;top:4%;bottom:12%;border-radius:50%;background:radial-gradient(circle at 50% 40%,hsl(var(--hue) 96% 66% / .95),hsl(calc(var(--hue) + 45) 96% 70% / .55) 48%,transparent 74%);filter:blur(16px);z-index:-1}
.bubble .glass{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;padding:12px 10px 11px;border-radius:24px}
.bubble .t{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:700;font-size:21px;line-height:1.02;letter-spacing:-.012em;text-wrap:balance;margin-bottom:3px}
.bubble .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.bubble .ph{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:hsl(var(--hue) 70% 36%);margin-top:1px;line-height:1.2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble .ph{color:hsl(var(--hue) 90% 74%)}}
:root[data-theme="dark"] .bubble .ph{color:hsl(var(--hue) 90% 74%)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
/* The rest of the list, tighter: the name carries the row. */
.tight .row{min-height:52px;padding:8px 14px;gap:10px}.tight .row .t{font-size:16px;font-weight:700}.tight .row .s{font-size:13px;margin-top:1px}.tight .row .tr{font-size:11px}.tight .row .tr b{font-size:14px}

.orbrow{display:flex;justify-content:center;gap:14px;margin:22px 0 26px}
.orb{display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;isolation:isolate;padding:0;width:98px;text-align:center}
.orb .glow{position:absolute;left:12px;right:12px;top:-4px;height:96px;border-radius:50%;background:radial-gradient(circle,hsl(var(--hue) 96% 66% / .95),transparent 70%);filter:blur(14px);z-index:-1}
.orb .glass{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.orb .glass svg{width:30px;height:30px}
.orb .l{font-size:13px;font-weight:600}
.orb .badge{position:absolute;top:-2px;right:8px}
.trio .orb{width:78px}.trio .orb .glass{width:66px;height:66px}.trio .orb .glass svg{width:24px;height:24px}.trio .orb .glow{height:72px;top:-3px}

/* The one loud element. */
.sky{position:relative;isolation:isolate;display:block;width:100%;padding:0;text-align:center;margin-bottom:6px}
.sky .glow{position:absolute;inset:-4% 8% 8% 8%;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--c),transparent 70%);filter:blur(30px);z-index:-1;opacity:.9}
.sky .glass{display:block;border-radius:32px;padding:24px 20px 18px;color:var(--ink)}
.sky.warn .glass{background:linear-gradient(160deg,var(--warn),var(--warn-2));color:#fff;border-color:transparent;box-shadow:0 16px 44px rgba(244,63,94,.35)}
.sky.watch .glass{background:linear-gradient(160deg,var(--watch),var(--watch-2));color:var(--watch-ink);border-color:transparent;box-shadow:0 16px 44px rgba(255,176,59,.35)}
.sky .eyebrow{color:inherit;opacity:.72;margin:0 0 8px}
.sky h2{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-optical-sizing:auto;font-size:34px;line-height:1.04;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
.sky p{margin:8px auto 0;font-size:15px;line-height:1.4;max-width:30ch;opacity:.9}
.sky .strip{display:flex;gap:6px;margin-top:18px}
.sky .strip .c{flex:1;min-width:0;border-radius:14px;padding:8px 2px 7px;font-size:11px;line-height:1.2;background:rgba(255,255,255,.5)}
.sky.warn .strip .c{background:rgba(255,255,255,.18)}
.sky.watch .strip .c{background:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sky.ok .strip .c,:root:not([data-theme="light"]) .sky.none .strip .c{background:rgba(255,255,255,.08)}}
:root[data-theme="dark"] .sky.ok .strip .c,:root[data-theme="dark"] .sky.none .strip .c{background:rgba(255,255,255,.08)}
.sky .strip svg{width:22px;height:22px;margin:4px auto 3px;display:block}
.sky .strip b{display:block;font-size:14px;font-weight:600}
.sky .foot{display:block;margin-top:14px;font-size:12px;opacity:.72}
@media (prefers-reduced-motion:no-preference){
  .sky.warn .glass::after{content:"";position:absolute;inset:0;border-radius:32px;border:2px solid #fff;opacity:0;animation:pulse 1.8s ease-out infinite;pointer-events:none}
  @keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.035)}}
}
.sk{background:rgba(255,255,255,.45);border-radius:14px}
@media (prefers-reduced-motion:no-preference){
  .sk{background:linear-gradient(90deg,rgba(255,255,255,.35) 25%,rgba(255,255,255,.7) 40%,rgba(255,255,255,.35) 60%);background-size:300% 100%;animation:shimmer 1.4s ease infinite}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
}

/* A heads-up: what is on the way, how long until, what to do first. */
.headsup{display:block;width:100%;text-align:left;border-radius:var(--radius);padding:16px 16px 14px 20px;margin:12px 0 4px;position:relative;color:var(--ink)}
.headsup::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 3px 3px 0;background:var(--watch)}
.headsup.tornado::before,.headsup.flood::before{background:var(--warn)}
.hu-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hu-top .eyebrow{margin:0;text-align:left}
.hu-when{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--watch);color:var(--watch-ink);white-space:nowrap}
.headsup h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:600;font-size:26px;line-height:1.1;margin:6px 0 2px}
.headsup p{color:var(--muted);font-size:14px;line-height:1.35}
.hu-steps{display:block;margin:10px 0 8px}
.hu-steps .st{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.35;padding:3px 0}
.hu-steps .st svg{width:18px;height:18px;flex:none;color:var(--ok);margin-top:1px}
.hu-steps .st .task,.step .task{flex:1;min-width:0}
.hu-steps .st .by,.step .by{flex:none;margin-left:8px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:2px}
.hu-more{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--accent)}
.hu-more svg{width:16px;height:16px;opacity:1;color:inherit}
.countdown{border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center}
.countdown .eyebrow{margin:0 0 4px}
.countdown b{display:block;font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:44px;line-height:1;font-weight:600;letter-spacing:-.02em}
.countdown .s{display:block;color:var(--muted);font-size:15px;line-height:1.4;margin:8px auto 0;max-width:32ch}
.steps{counter-reset:step}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;font-size:16px;line-height:1.35;position:relative;counter-increment:step}
.step+.step::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(155,123,255,.18);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.step .n::after{content:counter(step)}
.tl{display:block;padding:12px 18px 13px;position:relative;font-size:16px;line-height:1.5}
.tl+.tl::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.tl .k{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tl.now{background:rgba(255,176,59,.16)}.tl.now .k{color:var(--watch-2)}

/* Lightning: the code on the festival page, and the screen behind it. */
.bolt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:62px;border-radius:var(--radius);margin:12px 0 4px;text-align:left;color:var(--ink);position:relative}
.bolt .lead{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:var(--ok)}
.bolt.orange .lead{background:#FF7A1A} .bolt.yellow .lead{background:var(--watch);color:var(--watch-ink)}
.bolt .lead svg{width:20px;height:20px}
.bolt .main{flex:1;min-width:0} .bolt .t{font-weight:600;font-size:17px;line-height:1.25} .bolt .s{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.3}
.bolt.red{background:linear-gradient(160deg,var(--warn),var(--warn-2));color:#fff;border-color:transparent;box-shadow:0 12px 34px rgba(244,63,94,.32)}
.bolt.red .lead{background:rgba(255,255,255,.22)} .bolt.red .s{color:rgba(255,255,255,.85)} .bolt.red .chev{color:#fff;opacity:.9}

/* Touch feel: squish on press, spring back on release, and the light behind it flares. */
.bubble>.glass,.orb>.glass,.sky>.glass,.mark>.glass,.btn,.tb,.play,button.row,button.alert{transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,background-color .16s;will-change:transform}

}

<div class="orbs" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i><i class="o5"></i></div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Fieldwatch on the web. Same festivals, same sources and the same data shapes as the iPhone app:
// the backend when one is configured, otherwise the National Weather Service and the NEXRAD archive
// straight from the browser. Everything fetched is cached, so the last good data shows when signal drops.
const NWS = 'https://api.weather.gov';
const IEM_WMS = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q-t.cgi';
const OSM = 'https://tile.openstreetmap.org';
const ATTRIBUTION = 'NOAA NEXRAD via Iowa Environmental Mesonet';
const HOURS = 12, DIRECT_STEP_MIN = 15, LAG_MIN = 10, HALF_M = 160000, SIZE = 512, R = 6378137;
const DAY = 86400000;
// A festival is listed only while it is on: from the grounds opening (a week before gates for early entry,
// vendors and build crews, unless the festival says when) until the day after it ends. Mirrors backend/src/festivals.js.
const LEAD_DAYS = 7, TAIL_DAYS = 1;
const opensAt = f => (f.groundsOpen && Date.parse(f.groundsOpen)) || Date.parse(f.startDate) - LEAD_DAYS * DAY;
const closesAt = f => Date.parse(f.endDate) + TAIL_DAYS * DAY;
const isLive = (f, now = Date.now()) => now >= opensAt(f) && now <= closesAt(f);
const live = () => FESTS.filter(f => isLive(f));
const isFeatured = f => (f.featured === undefined ? !f.origin || f.origin === 'curated' : !!f.featured);
// Where you are, if you let the app know: opens the festival you are standing at and places you on the radar.
const NEAR_KM = 12;
function distKm(a, b){ const R = 6371, rad = x => x * Math.PI / 180, dLat = rad(b.latitude - a.latitude), dLon = rad(b.longitude - a.longitude); const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); }
const fmtDist = km => km < 0.3 ? 'right here' : km < 16 ? `${(km / 1.609).toFixed(1)} mi` : `${Math.round(km / 1.609).toLocaleString()} mi`;
const away = f => (S.here ? distKm(S.here, f) : null);
const distNote = f => (S.here ? ` · ${fmtDist(away(f))}` : '');
// Inside a Claude artifact preview the browser is not allowed to reach outside hosts.
const IN_PREVIEW = !!(window.claude && typeof window.claude.use === 'function');
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const S = { screen: 'welcome', param: null, stack: [], fest: null, cache: {}, backend: '', busy: false, query: '', welcomed: false,
  fests: null, admin: '', push: null, vapid: null, link: null, here: null, geoDenied: false, locating: false, autoPicked: false,
  hereFest: null, wantHere: false, report: { what: '', where: '', error: null }, reporting: false, reported: null,
  post: { title: '', body: '', severity: 'minor', error: null }, posting: false, queue: null, queueBusy: false, sources: null, sourcesBusy: false };
let FESTS = [];
const STORE = 'fieldwatch.web';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE) || '{}'); Object.assign(S, { fest: d.fest || null, cache: d.cache || {}, backend: d.backend || '', welcomed: !!d.welcomed, fests: Array.isArray(d.fests) ? d.fests : null, admin: d.admin || '', push: d.push || null, geoDenied: !!d.geoDenied, hereFest: d.hereFest || null, feed: d.feed || null }); }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({ fest: S.fest, cache: S.cache, backend: S.backend, welcomed: S.welcomed, fests: S.fests, admin: S.admin, push: S.push, geoDenied: S.geoDenied, hereFest: S.hereFest, feed: S.feed })); }catch(e){}
}
// The Fieldwatch backend this build talks to unless Settings (or ?backend=) says otherwise. 'none' means NWS and the archive directly.
const DEFAULT_BACKEND = 'https://fieldwatch-production.up.railway.app';
/** An address as people type it: no scheme means https, no trailing slash. */
const cleanURL = v => { v = (v || '').trim().replace(/\/+$/, ''); return v && v !== 'none' && !/^https?:\/\//i.test(v) ? `https://${v}` : v; };
const backend = () => { const v = cleanURL(new URLSearchParams(location.search).get('backend') || S.backend || DEFAULT_BACKEND); return v === 'none' ? '' : v; };
// 'here' is a festival of your own: wherever the phone is, for the week. Everything keyed by latitude and longitude just works.
const fest = () => (S.fest === 'here' ? hereFest() : FESTS.find(f => f.id === S.fest));
function hereFest(){
  const h = S.hereFest; if (!h) return null;
  return { id: 'here', origin: 'here', name: 'Right here', location: h.location || '', county: h.county || '', latitude: h.latitude, longitude: h.longitude,
    startDate: new Date(Date.now() - DAY).toISOString(), endDate: new Date(Date.now() + 7 * DAY).toISOString(), isPartner: false, feeds: [], site: [], at: h.at };
}
const data = f => S.cache[f.id] || {};
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// ---- time --------------------------------------------------------------------------------------------
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtHour = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric' }).replace(/\s/g, ' ');
const fmtDay = iso => new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtWhen = iso => new Date(iso).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const fmtFull = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function ago(iso){
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 6) / 10;
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago';
}
// End stamps sit at local midnight after the last day, so nudge back six hours before naming the day.
const lastDay = f => new Date(Date.parse(f.endDate) - 6 * 3600000);
const fmtRange = f => { const a = fmtDay(f.startDate), b = fmtDay(lastDay(f)); return a === b ? a : `${a} – ${b}`; };
function phase(f, now = Date.now()){
  const start = Date.parse(f.startDate), end = Date.parse(f.endDate);
  if (now > end) return now <= closesAt(f) ? { key: 'wrap', text: 'Wrapping up' } : { key: 'ended', text: 'Ended' };
  if (now >= start) return { key: 'now', text: 'Happening now' };
  const d = Math.ceil((start - now) / DAY);
  if (now >= opensAt(f)) return { key: 'open', text: d <= 1 ? 'Gates tomorrow' : `Gates in ${d} days` };
  return { key: d <= 14 ? 'soon' : 'later', text: `In ${d} days` };
}

async function getJSON(url, headers){

  try{
    const r = await fetch(url, { headers: headers || {}, signal: ctl.signal });

}
const GEO = { Accept: 'application/geo+json' };

const normalizeAlert = ft => { const p = ft.properties; return {

  severity: String(p.severity || 'Unknown').toLowerCase(), area: p.areaDesc ?? '', source: p.senderName ?? 'National Weather Service',
  issuedAt: p.effective, onset: p.onset ?? null, expiresAt: p.ends ?? p.expires ?? null, channel: 'weather', relayCount: 0 }; };
const isWarning = a => a.severity === 'severe' || a.severity === 'extreme';
const isActive = a => !a.expiresAt || Date.parse(a.expiresAt) > Date.now();

const skyAlerts = f => activeAlerts(f).filter(a => a.channel !== 'headsup');   // a heads-up has its own card under the sky
const level = f => { const al = skyAlerts(f); return al.some(isWarning) ? 'warn' : al.length ? 'watch' : 'ok'; };
const alertSub = a => a.channel === 'headsup' ? (a.onset ? `Expected ${fmtWhen(a.onset)}` : 'On the way') : a.expiresAt ? `Until ${fmtWhen(a.expiresAt)}` : (a.area || '');

async function loadAlerts(f){
  const b = backend();
  if (b) { try { return await getJSON(`${b}/festivals/${f.id}/alerts`); } catch(e) {} }   // fall back to NWS, like the app
  const fc = await getJSON(`${NWS}/alerts/active?point=${pt(f)}`, GEO);

// /points rarely changes; one request per festival per session feeds the hourly, the grid and the days.
const POINTS = {};
function pointFor(f){
  const k = pt(f);
  if (!POINTS[k]) POINTS[k] = getJSON(`${NWS}/points/${k}`, GEO).then(r => r.properties).catch(e => { delete POINTS[k]; throw e; });

async function loadHourly(f){

// The grid behind the forecast (/gridpoints/{wfo}/{x},{y}), raw: the shared block below spreads it hour by hour once the hourly forecast is in.
async function loadGrid(f){

function peak(f, key, hours){ let best = null; for (const h of hours) { const v = gridAt(f, key, h.startTime); if (v != null && (!best || v > best.v)) best = { v, t: h.startTime }; } return best; }

/** Pull everything for the chosen festival. Whatever succeeds replaces the cache; whatever fails leaves the last good copy. */
async function refresh(f){
  if (!f || S.busy) return;
  S.busy = true; render();
  const b = backend();
  const [al, hr, po, inc, gr, dy, lt, gd] = await Promise.allSettled([
    loadAlerts(f), loadHourly(f),
    b ? getJSON(`${b}/festivals/${f.id}/posts`) : Promise.resolve(data(f).posts || []),
    b ? getJSON(`${b}/festivals/${f.id}/incidents`) : Promise.resolve(null),
    loadGrid(f), loadDaily(f),
    b ? getJSON(`${b}/festivals/${f.id}/lightning`) : Promise.resolve(null),
    b ? getJSON(`${b}/festivals/${f.id}/ground`) : Promise.resolve(null),
  ]);
  const next = { ...data(f) };
  let ok = false;
  if (al.status === 'fulfilled') {
    // A warning that was not there at the last check gets a buzz, even with the screen open.
    const had = data(f).alerts, seen = new Set((had || []).map(a => a.id));
    const fresh = had ? al.value.filter(a => isWarning(a) && !seen.has(a.id)) : [];
    next.alerts = al.value; ok = true;
    const heads = had ? al.value.filter(a => a.channel === 'headsup' && isActive(a) && !seen.has(a.id)) : [];
    if (fresh.length) alarm(fresh[0]); else if (heads.length) toast(heads[0].event, 6000);
  }
  if (hr.status === 'fulfilled') { next.hourly = hr.value; ok = true; }
  if (po.status === 'fulfilled') next.posts = po.value;
  if (inc.status === 'fulfilled') next.incidents = inc.value;
  if (gr.status === 'fulfilled') next.grid = spreadGrid(gr.value, next.hourly || data(f).hourly || []);
  if (gd.status === 'fulfilled') next.ground = gd.value;
  if (dy.status === 'fulfilled') next.daily = dy.value;
  if (lt.status === 'fulfilled') next.lightning = lt.value;
  next.checkedAt = new Date().toISOString();
  if (ok) { next.at = next.checkedAt; next.error = null; }
  else next.error = (al.reason && al.reason.message) || (hr.reason && hr.reason.message) || 'unreachable';
  S.cache[f.id] = next; S.busy = false; save(); render();
}

const mercator = (lat, lon) => ({ x: R * lon * Math.PI / 180, y: R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) });
function coverage(f){ const c = mercator(f.latitude, f.longitude); return [c.x - HALF_M, c.y - HALF_M, c.x + HALF_M, c.y + HALF_M]; }
const isoMin = t => new Date(t).toISOString().replace(/\.\d{3}Z$/, 'Z');
function iemURL(bbox, t){
  const p = new URLSearchParams({ SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap', LAYERS: 'nexrad-n0q-wmst', STYLES: '', SRS: 'EPSG:3857',
    BBOX: bbox.map(n => n.toFixed(0)).join(','), WIDTH: SIZE, HEIGHT: SIZE, FORMAT: 'image/png', TRANSPARENT: 'true', TIME: isoMin(t) });
  return `${IEM_WMS}?${p}`;
}
async function radarLoop(f){
  const b = backend(), bbox = coverage(f);
  if (b) {
    // The backend's cache serves everyone once it holds a couple of hours; until then, or when it is down, the archive answers directly, like the alerts.
    try {
      const m = await getJSON(`${b}/festivals/${f.id}/radar`);
      if (m && Array.isArray(m.frames) && m.frames.length >= 12) return { bbox, frames: m.frames.map(x => ({ time: x.time, url: /^https?:/.test(x.url) ? x.url : b + x.url })), attribution: m.attribution, hours: m.hours, step: m.stepMinutes };
    } catch(e) {}
  }

  const step = DIRECT_STEP_MIN * 60000, newest = Math.floor((Date.now() - LAG_MIN * 60000) / step) * step, frames = [];
  for (let t = newest - HOURS * 3600000 + step; t <= newest; t += step) frames.push({ time: isoMin(t), url: iemURL(bbox, t) });

}
/** OpenStreetMap tiles under the radar square, placed in the same Web Mercator metres. Zoom 8 is about 610 m per pixel. */
function tiles(bbox){
  const z = 8, world = 40075016.686, tileM = world / 2 ** z, mpp = (bbox[2] - bbox[0]) / SIZE, out = [];
  const tx0 = Math.floor((bbox[0] + world / 2) / tileM), tx1 = Math.floor((bbox[2] + world / 2) / tileM);
  const ty0 = Math.floor((world / 2 - bbox[3]) / tileM), ty1 = Math.floor((world / 2 - bbox[1]) / tileM);

  if (S.screen !== 'radar') return;

function chartSVG(hours){
  const W = 360, PADL = 30, PADR = 10, TOP = 22, TH = 92, GAP = 22, RH = 44, BOT = 22;
  const rainy = hours.some(h => (h.precipChance || 0) > 0);
  const H = TOP + TH + (rainy ? GAP + RH : 0) + BOT;
  const n = hours.length, x = i => PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1));
  const temps = hours.map(h => h.temperature), tmin = Math.min(...temps), tmax = Math.max(...temps);
  const lo = Math.floor((tmin - 3) / 5) * 5, hi = Math.ceil((tmax + 3) / 5) * 5;
  const y = t => TOP + TH - (t - lo) / (hi - lo) * TH;
  const pts = temps.map((t, i) => [x(i), y(t)]);
  // Catmull-Rom through the hourly points, so the curve passes through every reading.
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${d} L${pts.at(-1)[0].toFixed(1)},${TOP + TH} L${pts[0][0].toFixed(1)},${TOP + TH} Z`;

function chartHover(){
  const svgEl = document.getElementById('chart'), tip = document.getElementById('tip'); if (!svgEl || !tip) return;

  const at = clientX => {
    const r = svgEl.getBoundingClientRect(), fx = (clientX - r.left) / r.width * W;
    return Math.max(0, Math.min(n - 1, Math.round((fx - PADL) / (W - PADL - PADR) * (n - 1))));
  };
  const show = (e) => {
    const i = at(e.clientX), h = hours[i]; if (!h) return;
    const g = document.getElementById('xh'), r = svgEl.getBoundingClientRect(), x = PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1));
    const temps = hours.map(q => q.temperature), lo = Math.floor((Math.min(...temps) - 3) / 5) * 5, hi = Math.ceil((Math.max(...temps) + 3) / 5) * 5;

    tip.style.display = 'block'; tip.style.left = `${(x / W) * r.width + (r.left - svgEl.parentElement.getBoundingClientRect().left)}px`; tip.style.top = `${(yy / (+svgEl.getAttribute('viewBox').split(' ')[3])) * r.height + (r.top - svgEl.parentElement.getBoundingClientRect().top)}px`;
  };

// ---- alert text: NWS bullets become sections -----------------------------------------------------------------
function parseNWS(text){
  const parts = String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const sections = [], paragraphs = [];
  for (const p of parts) {
    const m = p.match(/^\*\s*([A-Z][A-Z /]+?)\.{2,}\s*(.*)$/);
    if (m) sections.push({ label: m[1].charAt(0) + m[1].slice(1).toLowerCase(), text: m[2] }); else paragraphs.push(p);
  }
  return { sections, paragraphs };
}
/** The dashes the weather service uses as bullets inside a section, split into lines of their own. */
const bullets = t => String(t || '').split(/(?:^|\s)-\s+(?=\S)/).map(x => x.trim()).filter(Boolean);
/** A long area list, cut short: "Harrison, Shelby, Pottawattamie and 21 more". */
function areaText(area){ const parts = String(area || '').split(/;\s*/).filter(Boolean); return parts.length > 4 ? `${parts.slice(0, 3).join(', ')} and ${parts.length - 3} more` : parts.join(', '); }

const section = (label, texts) => `<div class="sec"><span class="k">${esc(label)}</span>${texts.map(t => `<p>${esc(t)}</p>`).join('')}</div>`;
/** One line about the next hours, from the forecast itself. */
function outlook(f){
  const hr = (data(f).hourly || []).slice(0, 12); if (!hr.length) return '';
  const storm = hr.find(h => /thunder/i.test(h.shortForecast || ''));
  const thunder = peak(f, 'thunder', hr), heat = peak(f, 'heat', hr), gust = peak(f, 'gust', hr);
  if (thunder && thunder.v >= 50) return `Thunder likely around ${fmtHour(thunder.t)}. Know your shelter.`;
  if (storm) return `Thunderstorms possible around ${fmtHour(storm.startTime)}.`;
  if (heat && heat.v >= 100) return `Heat index ${Math.round(heat.v)}° by ${fmtHour(heat.t)}. Water and shade, now.`;
  if (gust && gust.v >= 40) return `Gusts to ${Math.round(gust.v)} mph around ${fmtHour(gust.t)}. Tie everything down.`;
  const wet = hr.find(h => (h.precipChance || 0) >= 50);
  if (wet) return `Rain likely around ${fmtHour(wet.startTime)}.`;
  if (heat && heat.v >= 90) return `Heat index ${Math.round(heat.v)}° by ${fmtHour(heat.t)}. Drink water.`;
  if (gust && gust.v >= 30) return `Gusts to ${Math.round(gust.v)} mph around ${fmtHour(gust.t)}.`;
  const some = hr.find(h => (h.precipChance || 0) >= 25);
  if (some) return `A chance of rain from ${fmtHour(some.startTime)}.`;
  return 'Dry for the next 12 hours.';
}

// Fieldwatch's weather logic, byte for byte the same in backend/src/incoming.js and web/index.html: the backend pushes

const HOUR = 3600000;

// ---- day by day: the 7-day forecast folded into one row per festival day, and what to pack ---------------------
const dateIn = (t, tz) => { try { return new Date(t).toLocaleDateString('en-CA', { timeZone: tz }); } catch(e) { return new Date(t).toISOString().slice(0, 10); } };
const weekday = (k, long) => new Date(`${k}T12:00:00`).toLocaleDateString([], { weekday: long ? 'long' : 'short' });
function festivalDays(f){
  const dy = data(f).daily; if (!dy || !dy.periods || !dy.periods.length) return [];
  const byDay = new Map();
  for (const p of dy.periods) {
    const k = String(p.startTime).slice(0, 10), d = byDay.get(k) || { date: k, high: null, low: null, rain: 0, forecast: '', wind: '' };
    if (p.isDaytime) { d.high = p.temperature; d.forecast = p.shortForecast; d.wind = p.windSpeed; } else { d.low = p.temperature; if (!d.forecast) d.forecast = p.shortForecast; if (!d.wind) d.wind = p.windSpeed; }
    d.rain = Math.max(d.rain, p.precipChance || 0); byDay.set(k, d);
  }
  const end = dateIn(closesAt(f) - 1, dy.tz);
  return [...byDay.values()].filter(d => d.date <= end).slice(0, 7);
}
function packLine(days){
  if (!days.length) return '';
  const lows = days.map(d => d.low).filter(v => v != null), highs = days.map(d => d.high).filter(v => v != null), bits = [];
  if (lows.length && Math.min(...lows) <= 45) bits.push('cold nights'); else if (lows.length && Math.min(...lows) <= 55) bits.push('cool nights');
  if (highs.length && Math.max(...highs) >= 95) bits.push('serious heat'); else if (highs.length && Math.max(...highs) >= 88) bits.push('hot afternoons');
  const wet = days.filter(d => d.rain >= 50);
  if (wet.length >= 3) bits.push('rain most days'); else if (wet.length) bits.push(`rain ${wet.map(d => weekday(d.date, true)).join(' and ')}`);
  if (days.some(d => /\b(2[5-9]|[3-9]\d) mph/.test(d.wind || ''))) bits.push('wind');
  if (!bits.length) return 'Mild all the way through.';
  return `Pack for ${bits.length > 1 ? `${bits.slice(0, -1).join(', ')} and ${bits.at(-1)}` : bits[0]}.`;
}
function daysSection(f){
  const days = festivalDays(f); if (!days.length) return '';
  const row = d => `<div class="dayrow"><span class="wd">${esc(weekday(d.date))}</span><span class="fc">${esc(d.forecast)}</span><span class="hl num"><b>${d.high == null ? '–' : Math.round(d.high) + '°'}</b><span>${d.low == null ? '–' : Math.round(d.low) + '°'}</span></span><span class="rn">${d.rain ? d.rain + '%' : ''}</span></div>`;
  return `<p class="h">Day by day</p><p class="sub" id="pack">${esc(packLine(days))}</p><div class="group glass days">${days.map(row).join('')}</div>`;
}
function crewSection(f, hours){
  const svg = hours.length ? crewSVG(f, hours) : ''; if (!svg) return '';
  return `<p class="h">Heat, wind, lightning</p><div class="chart glass">${svg}<div class="tip" id="tip2"></div></div>`;
}

async function loadFeed(){
  if (S.feedBusy) return;
  S.feedBusy = true; render();
  try{
    const b = backend();
    let feed;
    if (b) { const r = await getJSON(`${b}/alerts`); feed = { at: r.at || new Date().toISOString(), on: r.on, items: r.items || [] }; }
    else {
      const on = live().sort((a, b) => (S.here ? away(a) - away(b) : 0) || Date.parse(a.startDate) - Date.parse(b.startDate)).slice(0, 12);
      const got = await Promise.allSettled(on.map(f => loadAlerts(f).then(alerts => ({ festival: f, alerts }))));
      if (on.length && got.every(r => r.status === 'rejected')) throw new Error('no signal');   // the last feed stays up, marked as old
      feed = { at: new Date().toISOString(), on: live().length, items: got.filter(r => r.status === 'fulfilled').map(r => r.value), partial: on.length < live().length };
    }
    feed.items = feed.items.map(i => ({ ...i, alerts: (i.alerts || []).filter(isActive).sort((x, y) => sevRank(y) - sevRank(x)) })).filter(i => i.festival && (i.alerts.length || ['red', 'orange'].includes(i.lightning && i.lightning.code)));
    S.feed = feed; S.feedErr = null;
  }catch(e){ S.feedErr = e; }
  S.feedBusy = false; save(); render();
}

const ACTION = {
  tornado: { warn: ['Get to the shelter now', 'Lowest floor of a solid building. Not a tent, not a car.'], watch: ['Know where the shelter is', 'Keep the phone on and charged.'] },
  storms:  { warn: ['Get into a vehicle or building', 'Not a tent, canopy or stage.'], watch: ['Know your shelter', 'A hard-topped vehicle or a building. Not a tent.'] },
  hail:    { warn: ['Get under a solid roof', 'Not a tent or canopy.'], watch: ['Know your shelter', 'Lay canopies flat before it comes.'] },
  wind:    { warn: ['Stay clear of tents and stages', 'Get into a vehicle or building if it turns dangerous.'], watch: ['Tie everything down', 'Drop pop-up canopies; they fly.'] },
  flood:   { warn: ['Move to high ground now', 'Never walk or drive through moving water.'], watch: ['Know the route to high ground', 'Move the tent off low ground.'] },
  heat:    { warn: ['Shade and water now', 'Medical tent at confusion or no sweat.'], watch: ['Water every twenty minutes', 'Shade at midday. Check on neighbours.'] },
  rain:    { warn: ['Get dry and off low ground', 'A vehicle or a building keeps you dry.'], watch: ['Move the tent off low ground', 'Bins and bags off the floor.'] },

/** [do, and] for an alert: the festival's own protocol for lightning, the timing line for a heads-up, the hazard for a warning. */

/** When the app and the backend do not talk: is it up, which build, which keys it sees, does the admin key match. */
async function checkBackend(){
  const b = backend(); if (!b || S.checkBusy) return;
  S.checkBusy = true; S.check = null; render();
  const why = e => /^HTTP \d+/.test(e.message) ? e.message : `no answer (${e.message})`;
  const lines = []; let ok = true, h = null;
  try{ h = await getJSON(`${b}/health`); }
  catch(e){
    const down = /^HTTP 50[23]/.test(e.message);
    S.check = { ok: false, summary: down ? 'The backend is down or restarting' : `Not answering: ${why(e)}`, detail: `${b}/health did not answer. ${down ? 'Railway has no running deploy: open the service, Deployments, and look at the latest one.' : 'Check the address above, then open that link in a browser.'}` };
    S.checkBusy = false; render(); return;
  }
  lines.push(`Up${h.build ? `, build ${h.build}` : ''}, ${h.festivals} festivals, data ${h.database && h.database.onVolume ? 'on a volume' : 'not on a volume'}`);
  const keys = Object.keys(h.sources || {}).filter(k => h.sources[k] === true || h.sources[k] === 'on').map(k => SOURCE_NAMES[k] || k);
  lines.push(keys.length ? `Sources on: ${keys.join(', ')}` : 'No source keys seen');
  if (h.nwsUserAgent === 'placeholder') lines.push('NWS_USER_AGENT is not set');
  if (h.imports) lines.push(h.imports.running ? 'An import is running' : h.imports.lastFinishedAt ? `Last import ${fmtFull(h.imports.lastFinishedAt)}` : 'No import has finished since boot');
  if (S.admin) {
    try{ await getJSON(`${b}/admin/import`, adminHeaders()); lines.push('Admin key matches'); }
    catch(e){ ok = false; lines.push(e.message === 'HTTP 401' ? (h.adminKey ? 'The admin key here does not match ADMIN_KEY on the backend' : 'ADMIN_KEY is not set on the backend') : `Admin check failed: ${why(e)}`); }
  }
  S.check = { ok, summary: ok ? lines[0] : lines[lines.length - 1], detail: lines.join('. ') + '.' };
  S.checkBusy = false; render();
}

    if (S.wantHere) { goHere(); return; }
    if (S.fest === 'here' && S.hereFest && distKm(S.here, S.hereFest) > 2) { S.hereFest = { ...S.hereFest, latitude: S.here.latitude, longitude: S.here.longitude, at: S.here.at, location: '', county: '' }; save(); refresh(fest()); resubscribePush(true); placeHere(); }

    if (S.screen === 'radar') { const st = document.getElementById('stage'); if (st && !document.querySelector('.rmap .me')) st.insertAdjacentHTML('beforeend', meDot(coverage(fest()))); }

function meDot(bbox){

  return `<div class="me" title="You" style="left:${((c.x - x0) / (x1 - x0) * SIZE).toFixed(1)}px;top:${((y1 - c.y) / (y1 - y0) * SIZE).toFixed(1)}px"></div>`;

    : Notification.permission === 'denied' ? 'Blocked in browser settings' : '';
  const tap = need ? (IOS && !STANDALONE ? "later(function(){ go('settings') })" : '') : 'togglePush()';
  return `<button class="row" onclick="${tap}" ${tap ? '' : 'disabled'}><span class="lead">${I.bell}</span><div class="main"><div class="t">Warnings on this phone</div><div class="s">${esc(need || (S.fest === 'here' ? 'For wherever this phone is' : 'Even when the app is closed'))}</div></div><span class="pill ${on ? 'on' : ''}">${on ? 'On' : 'Off'}</span></button>`;
}
const b64url = s => { const pad = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
async function vapidKey(){ if (!S.vapid) S.vapid = (await getJSON(`${backend()}/push/vapid`)).key; return S.vapid; }
const postJSON = (url, body, method) => fetch(url, { method: method || 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
async function togglePush(){
  if (!PUSH_OK || !fest()) return;
  const b = backend(); if (!b) { toast('Needs the backend'); return; }
  try{
    const reg = await navigator.serviceWorker.ready, cur = await reg.pushManager.getSubscription();
    if (S.push && cur) {
      await postJSON(`${b}/push/subscribe`, { endpoint: cur.endpoint }, 'DELETE').catch(() => {});
      await cur.unsubscribe(); S.push = null; save(); toast('Warnings off'); render(); return;
    }
    if (Notification.permission !== 'granted' && (await Notification.requestPermission()) !== 'granted') { toast('Notifications are blocked'); render(); return; }
    const key = await vapidKey();
    const sub = cur || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64url(key) });
    const r = await postJSON(`${b}/push/subscribe`, pushTarget(sub));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    S.push = { endpoint: sub.endpoint, fest: S.fest }; save(); toast(`On for ${S.fest === 'here' ? 'this spot' : fest().name}. A test notification is on its way.`, 4000);
  }catch(e){ toast(/404/.test(e.message) ? 'The backend has no push keys yet' : "Couldn't turn warnings on"); }
  render();
}
/** What a subscription follows: the festival, or the spot the phone is at. */
const pushTarget = sub => (S.fest === 'here' ? { subscription: sub.toJSON(), point: { latitude: S.hereFest.latitude, longitude: S.hereFest.longitude } } : { subscription: sub.toJSON(), festivalId: S.fest });
/** Once an hour at most, on open: warnings that are on stay on. The backend's key can change (a redeploy with no volume
 *  makes a new pair) or its record of this phone can be gone; either way the phone registers again, quietly, and a key
 *  change means a fresh subscription. A festival switch is resubscribePush's job. */
async function ensurePush(){
  if (!PUSH_OK || !S.push || !S.fest || S.push.fest !== S.fest || !fest() || !backend()) return;
  if (S.push.checked && Date.now() - S.push.checked < 3600e3) return;
  try{
    const reg = await navigator.serviceWorker.ready, cur = await reg.pushManager.getSubscription();
    if (!cur) { S.push = null; save(); render(); return; }
    const want = b64url(await vapidKey()), have = new Uint8Array(cur.options?.applicationServerKey || 0);
    const same = !have.length || (have.length === want.length && want.every((v, i) => v === have[i]));
    const sub = same ? cur : (await cur.unsubscribe(), await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want }));
    const r = await postJSON(`${backend()}/push/subscribe`, { ...pushTarget(sub), quiet: true });
    if (r.ok) { S.push = { endpoint: sub.endpoint, fest: S.fest, checked: Date.now() }; save(); render(); }
  }catch(e){}
}
/** Warnings follow the festival you chose, or your spot when it moves. */
async function resubscribePush(moved){
  if (!PUSH_OK || !S.push || !S.fest || (S.push.fest === S.fest && !moved) || !backend()) return;
  try{
    const reg = await navigator.serviceWorker.ready, cur = await reg.pushManager.getSubscription();
    if (!cur) { S.push = null; save(); render(); return; }
    const r = await postJSON(`${backend()}/push/subscribe`, pushTarget(cur));
    if (r.ok) { S.push = { endpoint: cur.endpoint, fest: S.fest }; save(); render(); }
  }catch(e){}
}

// ---- links straight to a festival: a push notification, a QR code at the gate ------------------------------
function applyLink(){
  const l = S.link; if (!l) return false;
  if (l.here) {
    S.link = null; S.welcomed = true;
    if (!S.hereFest) { S.wantHere = true; return false; }
    S.fest = 'here';
  } else {
    const f = FESTS.find(x => x.id === l.fest); if (!f) return false;
    S.fest = f.id;
  }
  S.stack = []; S.screen = 'home'; S.param = null; S.welcomed = true;
  if (l.alert) { S.stack = [{ name: 'home', param: null }]; S.screen = 'alert'; S.param = l.alert; }
  S.link = null; save();
  resubscribePush();
  return true;
}

let toastTimer;
function toast(msg, ms){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200); }
function alarm(a){ try{ if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600]); }catch(e){} toast(`New warning: ${a.event}`, 6000); }
async function share(id){
  const f = fest(), a = (data(f).alerts || []).find(x => x.id === id); if (!f || !a) return;
  const text = `${a.event} for ${a.area}. ${(a.headline || a.body || '').slice(0, 200)}${a.instruction ? ` ${a.instruction.replace(/\s+/g, ' ').slice(0, 160)}` : ''}`;
  const url = f.id === 'here' ? `${location.origin}${location.pathname}?here=1` : `${shareURL(f)}&alert=${encodeURIComponent(a.id)}`;
  try{
    if (navigator.share) await navigator.share({ title: a.event, text, url });
    else { await navigator.clipboard.writeText(`${text} ${url}`); toast('Copied. Send it to whoever needs it.'); }
  }catch(e){ if (!e || e.name !== 'AbortError') toast("Couldn't share on this device"); }
}

function render(rev){
  const app = document.getElementById('app');
  const fn = screens[S.screen] || screens.picker;
  app.innerHTML = `<div class="screen in ${rev ? 'rev' : ''}">${fn(S.param)}</div>`;
  if (S.screen === 'radar') { fitStage(); showFrame(); updatePlay(); updateRadarNote(); }
  if (S.screen === 'weather') { chartHover(); crewHover(); }
}

async function boot(){
  load();
  let bundled = [];
  try{ bundled = await (await fetch('festivals.json', { cache: 'no-cache' })).json(); }catch(e){}
  FESTS = backend() && S.fests ? mergeLists(bundled, S.fests) : bundled;
  const qs = new URLSearchParams(location.search);
  if (qs.get('f') || qs.get('here')) {
    S.link = { fest: qs.get('f'), here: !!qs.get('here'), alert: qs.get('alert') || null };
    qs.delete('f'); qs.delete('here'); qs.delete('alert');
    try{ history.replaceState(null, '', location.pathname + (qs.toString() ? `?${qs}` : '')); }catch(e){}
  }
  const linked = applyLink();
  if (S.fest && !(fest() && isLive(fest()))) S.fest = null;
  if (!linked) S.screen = !S.welcomed ? 'welcome' : 'feed';
  render();
  if (S.screen === 'feed' || S.wantHere) locate();
  if (S.screen === 'feed') loadFeed();
  if (fest()) refresh(fest());
  syncFestivals();
  ensurePush();
  setInterval(tickCountdowns, 30000);
  setInterval(() => { if (document.visibilityState === 'visible' && fest() && backend()) loadLightning(fest()); }, 60000);
  setInterval(() => { if (document.visibilityState !== 'visible') return; if (fest() && !S.busy) refresh(fest()); if (S.screen === 'feed') loadFeed(); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const d = fest() && data(fest()); if (d && d.at && Date.now() - Date.parse(d.at) > 5 * 60000 && !S.busy) refresh(fest());
    if (S.screen === 'feed' && (!S.feed || Date.now() - Date.parse(S.feed.at) > 5 * 60000)) loadFeed();
  });
  // The app shell works offline once installed; previews and plain http have no service workers.
  if ('serviceWorker' in navigator && !IN_PREVIEW && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
</script>
