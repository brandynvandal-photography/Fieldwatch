<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fieldwatch</title>
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#141A22; --muted:#6B7684; --line:#E6EAEF;
  --accent:#4F4BE0; --ok:#2C9A66; --watch:#E9A62C; --warn:#DC4A3D; --on-watch:#2A1A00;
  --shadow:0 10px 30px rgba(20,26,34,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101826; --surface:#182233; --surface-2:#202C40; --ink:#EEF1F5; --muted:#97A3B5; --line:#26334A;
    --accent:#8F8BFF; --ok:#31AE74; --watch:#F0B13C; --warn:#EE5A4D; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#101826; --surface:#182233; --surface-2:#202C40; --ink:#EEF1F5; --muted:#97A3B5; --line:#26334A;
  --accent:#8F8BFF; --ok:#31AE74; --watch:#F0B13C; --warn:#EE5A4D; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.35; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
input::-webkit-search-decoration,input::-webkit-search-cancel-button{-webkit-appearance:none}
.screen{min-height:100%;max-width:520px;margin:0 auto;padding:0 16px 40px}
@media (prefers-reduced-motion:no-preference){
  .screen.in{animation:slide .24s cubic-bezier(.2,.7,.2,1)}
  .screen.in.rev{animation-name:slideRev}
  @keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes slideRev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg);
  display:flex; align-items:center; justify-content:space-between; height:52px; margin:0 -16px; padding:0 8px;
}
.topbar .side{min-width:72px;display:flex;align-items:center}
.topbar .side.r{justify-content:flex-end}
.topbar .mid{flex:1;text-align:center;font-weight:600;font-size:17px}
.tb{display:inline-flex;align-items:center;gap:2px;padding:8px;border-radius:10px;color:var(--accent);font-weight:500}
.tb:active{background:var(--surface-2)}
.tb svg{width:22px;height:22px}
.large{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:18px}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:22px;
}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--muted)}
.h{font-size:13px;color:var(--muted);margin:0 0 8px 4px}
.group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:22px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:58px;position:relative;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
button.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25}
.row .s{color:var(--muted);font-size:14px;margin-top:2px}
.row .tr{text-align:right;color:var(--muted);font-size:14px;flex:none}
.row .tr b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.chev{width:18px;height:18px;color:var(--muted);flex:none;opacity:.7}
.badge{
  min-width:22px;height:22px;border-radius:11px;background:var(--warn);color:#fff;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;padding:0 7px;flex:none;
}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.warn{background:var(--warn)} .dot.watch{background:var(--watch)} .dot.ok{background:var(--ok)}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);
  font-size:14px;font-weight:600;margin-bottom:18px;
}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.pill.off i{background:var(--muted)}
.status{border-radius:20px;padding:22px 20px;margin-bottom:22px;color:#fff;position:relative;overflow:hidden}
.status.ok{background:var(--ok)}
.status.watch{background:var(--watch);color:var(--on-watch)}
.status.warn{background:var(--warn)}
.status h2{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.status p{margin-top:6px;font-size:15px;opacity:.88}
.status .tap{margin-top:14px;font-size:14px;font-weight:600;opacity:.95}
@media (prefers-reduced-motion:no-preference){
  .status.warn::after{content:"";position:absolute;inset:0;border-radius:20px;border:2px solid #fff;opacity:0;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
}
.card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:22px}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px}
.card p{color:var(--muted);font-size:15px}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;background:var(--accent);
  color:#fff;font-weight:600;font-size:17px;margin-bottom:12px;
}
.btn.quiet{background:var(--surface);color:var(--accent)}
.btn:active{opacity:.85}
.hourly{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hourly::-webkit-scrollbar{display:none}
.hr{flex:none;width:68px;background:var(--surface);border-radius:14px;padding:12px 6px;text-align:center}
.hr .tm{font-size:13px;color:var(--muted)}
.hr svg{width:26px;height:26px;margin:8px 0}
.hr .tp{font-weight:600;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
.tile{background:var(--surface);border-radius:14px;padding:12px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.tile .n{font-size:12px;color:var(--muted)}
.post{padding:14px 16px;position:relative}
.post+.post::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.post .t{font-weight:600}
.post .b{font-size:15px;color:var(--muted);margin-top:2px}
.post .at{font-size:13px;color:var(--muted);margin-top:6px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.big{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1}
.alerthead{border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:22px}
.alerthead.watch{background:var(--watch);color:var(--on-watch)}
.alerthead.warn{background:var(--warn)}
.alerthead .lv{font-size:14px;font-weight:600;opacity:.9}
.alerthead h2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.alerthead p{margin-top:8px;font-size:15px;opacity:.9}
.body{font-size:17px;line-height:1.5;margin-bottom:22px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;position:relative;font-size:15px}
.kv+.kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:500}
.play{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.play svg{width:18px;height:18px}
.play.on{background:var(--accent);color:#fff}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:8px;vertical-align:middle}
.bars i{width:3px;background:var(--accent);height:6px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .bars i{animation:bar .8s ease-in-out infinite alternate}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
  @keyframes bar{from{height:4px}to{height:14px}}
}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:18px 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s ease}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px;color:var(--muted)}
.step.done{color:var(--ink)}
.step .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.step .ck svg{width:12px;height:12px;opacity:0}
.step.done .ck svg{opacity:1}
.note{font-size:13px;color:var(--muted);margin:-10px 4px 22px}
.banner{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;z-index:50;max-width:500px;margin:0 auto;
  background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;
  transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:left;width:auto;
}
.banner.show{transform:none}
.banner .ic{width:38px;height:38px;border-radius:9px;background:var(--accent);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.banner .ic svg{width:22px;height:22px}
.banner .m{flex:1;min-width:0}
.banner .app{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.banner .t{display:block;font-weight:600;font-size:15px;margin-top:1px}
.banner .b{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-weight:600}
.link{color:var(--accent);font-weight:500}

.rctl{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rctl input[type=range]{flex:1;accent-color:#0a84ff}

.hr .pp{font-size:12px;color:#4F8FE0;margin-top:2px}
.rmap{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#1d2733;margin-bottom:12px}
.rmap .stage{position:absolute;left:0;top:0;width:512px;height:512px;transform-origin:0 0}
.rmap .tile{position:absolute;filter:saturate(.6) brightness(.9)}
.rmap .frame{position:absolute;left:0;top:0;width:512px;height:512px;display:none;opacity:.78}
.rmap .frame.on{display:block}
.rmap .pin{position:absolute;left:256px;top:256px;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #0a84ff,0 0 0 8px rgba(10,132,255,.25)}
.rmap .rtime,.rmap .rleg{position:absolute;background:rgba(255,255,255,.92);color:#111;border-radius:999px;font-variant-numeric:tabular-nums}
.rmap .rtime{left:12px;top:12px;font-weight:600;font-size:14px;padding:6px 12px}
.rmap .rleg{right:12px;bottom:12px;font-size:12px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.rmap .rleg i{display:block;width:60px;height:8px;border-radius:999px;background:linear-gradient(90deg,#2fb04a,#ffe600,#f2a900,#c8102e,#a020a0)}
.rctl input[type=range]{flex:1;accent-color:#0a84ff}
.tb[disabled]{opacity:.4}
a.link{text-decoration:none}
.lead{font-weight:600;font-size:17px;line-height:1.4;margin-bottom:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script>
// Fieldwatch on the web. Same festivals, same data sources and the same shapes as the iPhone app:
// the backend when one is configured, otherwise the National Weather Service and the NEXRAD archive
// directly from the browser. Everything it fetches is cached, so the last good data shows when signal drops.
const NWS = 'https://api.weather.gov';
const IEM_WMS = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q-t.cgi';
const OSM = 'https://tile.openstreetmap.org';
const ATTRIBUTION = 'NOAA NEXRAD via Iowa Environmental Mesonet';
const HOURS = 12, DIRECT_STEP_MIN = 15, LAG_MIN = 10, HALF_M = 160000, SIZE = 512, R = 6378137;
// Inside a Claude artifact preview the browser is not allowed to reach outside hosts.
const IN_PREVIEW = !!(window.claude && typeof window.claude.use === 'function');

const S = { screen: 'picker', param: null, stack: [], fest: null, cache: {}, backend: '', busy: false };
let FESTS = [];
const STORE = 'fieldwatch.web';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE) || '{}'); Object.assign(S, { fest: d.fest || null, cache: d.cache || {}, backend: d.backend || '' }); }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({ fest: S.fest, cache: S.cache, backend: S.backend })); }catch(e){}
}
const backend = () => (new URLSearchParams(location.search).get('backend') || S.backend || '').replace(/\/+$/, '');
const fest = () => FESTS.find(f => f.id === S.fest);
const data = f => S.cache[f.id] || {};
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

// ---- time ------------------------------------------------------------------------------------------
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = iso => new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
const fmtWhen = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function ago(iso){
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 6) / 10;
  return (h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago');
}
// End stamps sit at local midnight after the last day, so nudge back six hours before naming the day.
const fmtRange = f => `${fmtDay(f.startDate)} – ${fmtDay(new Date(Date.parse(f.endDate) - 6 * 3600000))}`;

// ---- weather data (mirrors backend/src/nws.js and NWSClient.swift) ----------------------------------
async function getJSON(url, headers){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(url, { headers: headers || {}, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const GEO = { Accept: 'application/geo+json' };
const pt = f => `${f.latitude.toFixed(4)},${f.longitude.toFixed(4)}`;
const normalizeAlert = ft => { const p = ft.properties; return {
  id: p.id, event: p.event, headline: p.headline ?? null, body: p.description ?? '', instruction: p.instruction ?? null,
  severity: String(p.severity || 'Unknown').toLowerCase(), area: p.areaDesc ?? '', source: p.senderName ?? 'National Weather Service',
  issuedAt: p.effective, expiresAt: p.ends ?? p.expires ?? null, channel: 'weather', relayCount: 0 }; };
const isWarning = a => a.severity === 'severe' || a.severity === 'extreme';
const isActive = a => !a.expiresAt || Date.parse(a.expiresAt) > Date.now();
const activeAlerts = f => (data(f).alerts || []).filter(isActive).sort((a, b) => (isWarning(b) - isWarning(a)));
const level = f => { const al = activeAlerts(f); return al.some(isWarning) ? 'warn' : al.length ? 'watch' : 'ok'; };

async function loadAlerts(f){
  const b = backend();
  if (b) { try { return await getJSON(`${b}/festivals/${f.id}/alerts`); } catch(e) {} }   // fall back to NWS, like the app
  const fc = await getJSON(`${NWS}/alerts/active?point=${pt(f)}`, GEO);
  return (fc.features || []).map(normalizeAlert);
}
async function loadHourly(f){
  const point = await getJSON(`${NWS}/points/${pt(f)}`, GEO);
  const fc = await getJSON(point.properties.forecastHourly, GEO);
  return fc.properties.periods.slice(0, 36).map(x => ({ startTime: x.startTime, temperature: x.temperature, shortForecast: x.shortForecast, windSpeed: x.windSpeed, precipChance: x.probabilityOfPrecipitation?.value ?? null }));
}

/** Pull everything for the chosen festival. Whatever succeeds replaces the cache; whatever fails leaves the last good copy. */
async function refresh(f){
  if (!f || S.busy) return;
  S.busy = true; render();
  const b = backend();
  const [al, hr, po, inc] = await Promise.allSettled([
    loadAlerts(f), loadHourly(f),
    b ? getJSON(`${b}/festivals/${f.id}/posts`) : Promise.resolve(data(f).posts || []),
    b ? getJSON(`${b}/festivals/${f.id}/incidents`) : Promise.resolve(null),
  ]);
  const next = { ...data(f) };
  let ok = false;
  if (al.status === 'fulfilled') { next.alerts = al.value; ok = true; }
  if (hr.status === 'fulfilled') { next.hourly = hr.value; ok = true; }
  if (po.status === 'fulfilled') next.posts = po.value;
  if (inc.status === 'fulfilled') next.incidents = inc.value;
  next.checkedAt = new Date().toISOString();
  if (ok) { next.at = next.checkedAt; next.error = null; }
  else next.error = (al.reason && al.reason.message) || (hr.reason && hr.reason.message) || 'unreachable';
  S.cache[f.id] = next; S.busy = false; save(); render();
}

// ---- radar (mirrors backend/src/radar.js) ------------------------------------------------------------
const mercator = (lat, lon) => ({ x: R * lon * Math.PI / 180, y: R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) });
function coverage(f){ const c = mercator(f.latitude, f.longitude); return [c.x - HALF_M, c.y - HALF_M, c.x + HALF_M, c.y + HALF_M]; }
const isoMin = t => new Date(t).toISOString().replace(/\.\d{3}Z$/, 'Z');
function iemURL(bbox, t){
  const p = new URLSearchParams({ SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap', LAYERS: 'nexrad-n0q-wmst', STYLES: '', SRS: 'EPSG:3857',
    BBOX: bbox.map(n => n.toFixed(0)).join(','), WIDTH: SIZE, HEIGHT: SIZE, FORMAT: 'image/png', TRANSPARENT: 'true', TIME: isoMin(t) });
  return `${IEM_WMS}?${p}`;
}
async function radarLoop(f){
  const b = backend(), bbox = coverage(f);
  if (b) {
    const m = await getJSON(`${b}/festivals/${f.id}/radar`);
    return { bbox, frames: m.frames.map(x => ({ time: x.time, url: /^https?:/.test(x.url) ? x.url : b + x.url })), attribution: m.attribution, hours: m.hours, step: m.stepMinutes };
  }
  // Straight from the archive: 12 hours at 15-minute steps, newest at least 10 minutes old (composites land late).
  const step = DIRECT_STEP_MIN * 60000, newest = Math.floor((Date.now() - LAG_MIN * 60000) / step) * step, frames = [];
  for (let t = newest - HOURS * 3600000 + step; t <= newest; t += step) frames.push({ time: isoMin(t), url: iemURL(bbox, t) });
  return { bbox, frames, attribution: ATTRIBUTION, hours: HOURS, step: DIRECT_STEP_MIN };
}
/** OpenStreetMap tiles under the radar square, placed in the same Web Mercator metres. Zoom 8 is about 610 m per pixel. */
function tiles(bbox){
  const z = 8, world = 40075016.686, tileM = world / 2 ** z, mpp = (bbox[2] - bbox[0]) / SIZE, out = [];
  const tx0 = Math.floor((bbox[0] + world / 2) / tileM), tx1 = Math.floor((bbox[2] + world / 2) / tileM);
  const ty0 = Math.floor((world / 2 - bbox[3]) / tileM), ty1 = Math.floor((world / 2 - bbox[1]) / tileM);
  for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
    out.push({ url: `${OSM}/${z}/${tx}/${ty}.png`, left: (tx * tileM - world / 2 - bbox[0]) / mpp, top: (bbox[3] - (world / 2 - ty * tileM)) / mpp, size: tileM / mpp });
  }
  return out;
}

const radar = { frames: [], loaded: new Set(), failed: 0, index: 0, playing: true, timer: 0, loop: null };
function stopRadar(){ clearTimeout(radar.timer); radar.timer = 0; radar.frames = []; radar.loaded.clear(); radar.failed = 0; radar.loop = null; }
async function startRadar(f){
  stopRadar();
  let loop;
  try { loop = await radarLoop(f); } catch(e) { radar.loop = { error: e.message || 'unreachable', frames: [] }; render(); return; }
  radar.loop = loop; radar.frames = loop.frames; radar.index = loop.frames.length - 1; radar.playing = true;
  render();
  fitStage();
  // Newest first, so the present shows while the past fills in.
  loop.frames.map((fr, i) => i).reverse().forEach(i => {
    const img = document.getElementById('fr' + i); if (!img) return;
    img.onload = () => { radar.loaded.add(i); if (radar.loaded.size === 1) { radar.index = i; showFrame(); tick(); } updateRadarNote(); };
    img.onerror = () => { radar.failed++; updateRadarNote(); };
    img.src = loop.frames[i].url;
  });
}
function nextLoaded(from){
  const n = radar.frames.length;
  for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (radar.loaded.has(i)) return i; }
  return from;
}
function tick(){
  clearTimeout(radar.timer);
  if (!radar.playing || !radar.frames.length) return;
  const last = radar.index === Math.max(...radar.loaded);
  radar.timer = setTimeout(() => { if (!radar.playing) return; radar.index = nextLoaded(radar.index); showFrame(); tick(); }, last ? 1400 : 110);
}
function showFrame(){
  document.querySelectorAll('.frame').forEach((el, i) => el.classList.toggle('on', i === radar.index));
  const fr = radar.frames[radar.index]; const t = document.getElementById('radar-time'); const sl = document.getElementById('radar-slider');
  if (fr && t) t.textContent = `${fmtTime(fr.time)}, ${ago(fr.time)}`;
  if (sl) sl.value = radar.index;
}
function radarScrub(v){ radar.playing = false; clearTimeout(radar.timer); radar.index = +v; showFrame(); updatePlay(); }
function radarToggle(){ radar.playing = !radar.playing; updatePlay(); if (radar.playing) tick(); else clearTimeout(radar.timer); }
function updatePlay(){ const b = document.getElementById('radar-play'); if (!b) return; b.classList.toggle('on', radar.playing); b.innerHTML = radar.playing ? I.stop : I.play; b.setAttribute('aria-label', radar.playing ? 'Pause' : 'Play'); }
function updateRadarNote(){
  const n = document.getElementById('radar-loaded'); if (!n) return;
  const total = radar.frames.length, got = radar.loaded.size;
  n.textContent = got === total ? '' : radar.failed === total ? (IN_PREVIEW ? 'This preview cannot reach the radar archive. Host the web build to see it live.' : 'Cannot reach the radar archive right now.') : `Loading ${got} of ${total} frames.`;
}
function fitStage(){
  const box = document.getElementById('rmap'), st = document.getElementById('stage');
  if (box && st) st.style.transform = `scale(${box.clientWidth / SIZE})`;
}
window.addEventListener('resize', fitStage);

// ---- navigation --------------------------------------------------------------------------------------
function go(name, param, opts){
  opts = opts || {};
  stopRadar();
  if (!opts.replace) S.stack.push({ name: S.screen, param: S.param });
  if (opts.reset) S.stack = [];
  S.screen = name; S.param = param || null;
  render(false); window.scrollTo(0, 0);
  if (name === 'radar' && fest()) startRadar(fest());
}
function back(){
  stopRadar();
  const p = S.stack.pop();
  if (!p) { S.screen = S.fest ? 'channels' : 'picker'; S.param = null; }
  else { S.screen = p.name; S.param = p.param; }
  render(true); window.scrollTo(0, 0);
}
function pick(id){ S.fest = id; save(); go('channels', null, { reset: true }); refresh(fest()); }
function changeFestival(){ S.fest = null; save(); go('picker', null, { reset: true }); }

// ---- screens -------------------------------------------------------------------------------------------
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="#E9A62C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="#7F8FA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="#7F8FA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .5-9 7 7 0 0 0-13.4 2A4 4 0 0 0 6 19z"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="#7F8FA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 16a4.5 4.5 0 0 0 .5-9 7 7 0 0 0-13.4 2A4 4 0 0 0 6 16z"/><path d="M8 19v2M12 18v3M16 19v2" stroke="#4F8FE0"/></svg>',
  storm:'<svg viewBox="0 0 24 24" fill="none" stroke="#7F8FA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 17a4.5 4.5 0 0 0 .5-9 7 7 0 0 0-13.4 2A4 4 0 0 0 6 17z"/><path d="M13 12l-2 4h3l-2 4" stroke="#E9A62C"/></svg>',
  fog:'<svg viewBox="0 0 24 24" fill="none" stroke="#7F8FA6" stroke-width="2" stroke-linecap="round"><path d="M4 10h16M6 14h12M8 18h8"/></svg>',
};
function icon(h){
  const s = (h.shortForecast || '').toLowerCase(), hour = new Date(h.startTime).getHours(), night = hour < 6 || hour >= 20;
  if (s.includes('thunder')) return I.storm;
  if (s.includes('rain') || s.includes('shower') || s.includes('drizzle')) return I.rain;
  if (s.includes('fog') || s.includes('haze') || s.includes('smoke')) return I.fog;
  if (s.includes('cloud') || s.includes('overcast')) return I.cloud;
  return night ? I.moon : I.sun;
}
const topbar = (l, m, r) => `<div class="topbar"><div class="side">${l || ''}</div><div class="mid">${m || ''}</div><div class="side r">${r || ''}</div></div>`;
const backBtn = () => `<button class="tb" onclick="back()" aria-label="Back">${I.back}</button>`;
const gearBtn = () => `<button class="tb" onclick="go('settings')" aria-label="Settings">${I.gear}</button>`;
const refreshBtn = () => `<button class="tb" onclick="refresh(fest())" aria-label="Refresh" ${S.busy ? 'disabled' : ''}>${I.refresh}</button>`;
function statusLine(f){
  const d = data(f);
  if (S.busy) return 'Checking now';
  if (d.error && d.at) return `Last checked ${ago(d.at)}, before signal dropped`;
  if (d.error) return IN_PREVIEW ? 'This preview cannot reach the weather service' : 'Cannot reach the National Weather Service';
  if (d.at) return `Checked ${ago(d.at)}`;
  return 'Not checked yet';
}
const pill = f => { const d = data(f); const off = !!d.error; return `<span class="pill ${off ? 'off' : ''}"><i></i>${off ? 'Offline' : 'Live'}${d.at ? ', updated ' + ago(d.at) : ''}</span>`; };

const screens = {};

screens.picker = () => {
  const now = Date.now();
  const row = f => `<button class="row" onclick="pick('${f.id}')">
    <div class="main"><div class="t">${esc(f.name)}</div><div class="s">${esc(f.location)}</div></div>
    <div class="tr"><b>${esc(fmtRange(f))}</b>${esc(f.county)}</div>${I.chev}</button>`;
  const upcoming = FESTS.filter(f => Date.parse(f.endDate) >= now).sort((a, b) => Date.parse(a.startDate) - Date.parse(b.startDate));
  const soon = upcoming.filter(f => Date.parse(f.startDate) - now < 14 * 86400000), later = upcoming.filter(f => !soon.includes(f));
  const ended = FESTS.filter(f => Date.parse(f.endDate) < now);
  return topbar('', '', gearBtn()) + `
    <h1 class="large">Which festival?</h1>
    <p class="sub">Live weather, alerts and radar for the grounds.</p>
    ${soon.length ? `<p class="h">Coming up</p><div class="group">${soon.map(row).join('')}</div>` : ''}
    ${later.length ? `<p class="h">Later this season</p><div class="group">${later.map(row).join('')}</div>` : ''}
    ${ended.length ? `<p class="h">Ended</p><div class="group">${ended.map(row).join('')}</div>` : ''}
    ${FESTS.length ? '' : '<div class="card"><h3>No festivals loaded</h3><p>festivals.json did not load.</p></div>'}
    <p class="note">Dates and venues from each festival's own site, checked ${esc(FESTS[0]?.verifiedOn || '')}. Attendee relay and receiver pairing need the iPhone app.</p>`;
};

screens.channels = () => {
  const f = fest(); if (!f) return screens.picker();
  const d = data(f), al = activeAlerts(f), lv = level(f);
  const head = lv === 'warn' ? al.find(isWarning).event : lv === 'watch' ? (al.length === 1 ? al[0].event : al.length + ' advisories in effect') : (d.alerts ? 'All clear' : 'Checking');
  const sub = lv === 'warn' ? 'Take shelter now. Stages and tents are not safe shelter.'
            : lv === 'watch' ? (al[0].expiresAt ? 'Until ' + fmtWhen(al[0].expiresAt) + '. Tap for details.' : 'Tap for details.')
            : d.alerts ? `No weather alerts for ${f.county}.` : 'Pulling the latest from the National Weather Service.';
  const target = lv === 'ok' ? "go('weather')" : `go('alert','${esc((al.find(isWarning) || al[0]).id)}')`;
  return topbar(`<button class="tb" onclick="changeFestival()">${I.back}<span>Change</span></button>`, '', refreshBtn() + gearBtn()) + `
    <h1 class="large">${esc(f.name)}</h1>
    <p class="sub">${esc(f.location)}, ${esc(fmtRange(f))}</p>
    ${pill(f)}
    <button class="status ${lv}" style="width:100%;text-align:left" onclick="${target}">
      <h2>${esc(head)}</h2><p>${esc(sub)}</p>
      <div class="tap">${esc(statusLine(f))}</div>
    </button>
    <p class="h">Channels</p>
    <div class="group">
      <button class="row" onclick="go('weather')"><span class="dot ${lv}"></span><div class="main"><div class="t">Weather</div><div class="s">${al.length ? al.length + ' active alert' + (al.length > 1 ? 's' : '') : 'Forecast, radar and hazards'}</div></div>${I.chev}</button>
      <button class="row" onclick="go('official')"><div class="main"><div class="t">Festival official</div><div class="s">${f.isPartner ? 'Updates from the festival' : 'Not yet partnered'}</div></div>${I.chev}</button>
      <button class="row" onclick="go('incidents')"><div class="main"><div class="t">Incidents</div><div class="s">${backend() ? 'County dispatch and attendee reports' : 'Needs the Fieldwatch backend'}</div></div>${I.chev}</button>
    </div>
    <p class="note">Emergency alerts from your carrier still arrive on their own. Source: National Weather Service (${esc(f.county)}).</p>`;
};

screens.weather = () => {
  const f = fest(); if (!f) return screens.picker();
  const d = data(f), al = activeAlerts(f), hr = (d.hourly || []).slice(0, 24);
  return topbar(backBtn(), '', refreshBtn()) + `
    <h1 class="large">Weather</h1>
    <p class="sub">${esc(f.county)}</p>
    <div class="group"><button class="row" onclick="go('radar')"><div class="main"><div class="t">Radar</div><div class="s">Last ${HOURS} hours over the grounds</div></div>${I.chev}</button></div>
    ${al.length ? `<p class="h">Active alerts</p><div class="group">${al.map(a => `<button class="row" onclick="go('alert','${esc(a.id)}')"><span class="dot ${isWarning(a) ? 'warn' : 'watch'}"></span><div class="main"><div class="t">${esc(a.event)}</div><div class="s">${a.expiresAt ? 'Until ' + esc(fmtWhen(a.expiresAt)) : esc(a.area)}</div></div>${I.chev}</button>`).join('')}</div>`
                : d.alerts ? `<div class="card"><h3>No active alerts</h3><p>Nothing in effect for ${esc(f.county)} right now.</p></div>`
                : `<div class="card"><h3>${S.busy ? 'Checking' : 'No data yet'}</h3><p>${esc(statusLine(f))}.</p></div>`}
    <p class="h">Next hours</p>
    ${hr.length ? `<div class="hourly">${hr.map(h => `<div class="hr" title="${esc(h.shortForecast)}"><div class="tm">${esc(fmtTime(h.startTime).replace(':00', ''))}</div>${icon(h)}<div class="tp">${Math.round(h.temperature)}°</div>${h.precipChance ? `<div class="pp">${h.precipChance}%</div>` : ''}</div>`).join('')}</div>`
               : `<div class="card"><p>${S.busy ? 'Loading the hourly forecast.' : 'The forecast loads when you have signal.'}</p></div>`}
    <p class="note">National Weather Service. ${esc(statusLine(f))}.</p>`;
};

screens.radar = () => {
  const f = fest(); if (!f) return screens.picker();
  const loop = radar.loop, bbox = coverage(f);
  const body = !loop ? `<div class="card"><h3>Loading radar</h3><p>Fetching the last ${HOURS} hours.</p></div>`
    : loop.error ? `<div class="card"><h3>Radar unavailable</h3><p>${IN_PREVIEW ? 'This preview cannot reach the radar archive. Host the web build to see it live.' : 'Cannot reach the radar archive right now.'}</p></div>`
    : `<div class="rmap" id="rmap"><div class="stage" id="stage">
        ${tiles(bbox).map(t => `<img class="tile" alt="" src="${t.url}" style="left:${t.left}px;top:${t.top}px;width:${t.size}px;height:${t.size}px" onerror="this.remove()">`).join('')}
        ${loop.frames.map((fr, i) => `<img class="frame" id="fr${i}" alt="">`).join('')}
        <div class="pin" title="${esc(f.name)}"></div>
      </div>
      <div class="rtime" id="radar-time">Loading</div>
      <div class="rleg"><i></i>light to heavy</div>
    </div>
    <div class="rctl">
      <button class="play on" id="radar-play" onclick="radarToggle()" aria-label="Pause">${I.stop}</button>
      <input type="range" id="radar-slider" min="0" max="${Math.max(loop.frames.length - 1, 0)}" value="${Math.max(loop.frames.length - 1, 0)}" oninput="radarScrub(this.value)" aria-label="Scrub through the last ${HOURS} hours">
    </div>
    <p class="note" id="radar-loaded"></p>
    <p class="note">Last ${loop.hours} hours, every ${loop.step} minutes, 160 km from the grounds to the edge. ${esc(loop.attribution)}. Map © OpenStreetMap contributors.</p>`;
  return topbar(backBtn(), '', '') + `<h1 class="large">Radar</h1><p class="sub">${esc(f.county)}</p>${body}`;
};

screens.alert = id => {
  const f = fest(); const a = (data(f).alerts || []).find(x => x.id === id);
  if (!a) return topbar(backBtn(), '', '') + `<div class="empty"><b>Alert expired</b>It's no longer in effect.</div>`;
  const warn = isWarning(a);
  return topbar(backBtn(), '', navigator.share ? `<button class="tb" onclick="share('${esc(a.id)}')">Share</button>` : '') + `
    <div class="alerthead ${warn ? 'warn' : 'watch'}"><div class="lv">${warn ? 'Warning' : 'Advisory'}</div><h2>${esc(a.event)}</h2><p>${a.expiresAt ? 'Until ' + esc(fmtWhen(a.expiresAt)) : esc(a.area)}</p></div>
    ${a.headline ? `<p class="lead">${esc(a.headline)}</p>` : ''}
    <div class="body">${esc(a.body).replace(/\n\n/g, '<br><br>').replace(/\n/g, ' ')}</div>
    ${a.instruction ? `<div class="body" style="font-weight:500">${esc(a.instruction).replace(/\n\n/g, '<br><br>').replace(/\n/g, ' ')}</div>` : ''}
    <div class="group">
      <div class="kv"><span>Area</span><span>${esc(a.area)}</span></div>
      <div class="kv"><span>Source</span><span>${esc(a.source)}</span></div>
      <div class="kv"><span>Issued</span><span>${esc(fmtWhen(a.issuedAt))}</span></div>
      <div class="kv"><span>Severity</span><span>${esc(a.severity)}</span></div>
    </div>
    <p class="note">Saved in this browser. Reopens without signal.</p>`;
};

screens.official = () => {
  const f = fest(); if (!f) return screens.picker();
  const posts = data(f).posts || [];
  return topbar(backBtn(), '', '') + `
    <h1 class="large">Festival official</h1>
    <p class="sub">${esc(f.name)}</p>
    ${f.isPartner ? (posts.length ? `<p class="h">Updates</p><div class="group">${posts.map(p => `<div class="post"><div class="t">${esc(p.title)}</div><div class="b">${esc(p.body)}</div><div class="at">${esc(fmtWhen(p.postedAt))}</div></div>`).join('')}</div>` : '<div class="card"><h3>Nothing posted yet</h3></div>')
                 : `<div class="card"><h3>This festival hasn't joined yet</h3><p>When it does, staff updates and evacuation notices show up here.</p></div>`}
    <p class="h">On site</p>
    ${(f.site || []).length ? `<div class="group">${f.site.map(s => `<div class="row"><div class="main"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.detail)}</div></div></div>`).join('')}</div>`
                            : `<div class="card"><p>No site information for ${esc(f.name)} yet. Medical, water and exits appear here once the festival provides them.</p></div>`}
    <p class="note">Festival site: <a class="link" href="${esc(f.source)}" target="_blank" rel="noopener">${esc(f.source.replace(/^https?:\/\//, '').replace(/\/.*$/, ''))}</a></p>`;
};

screens.incidents = () => {
  const f = fest(); if (!f) return screens.picker();
  const list = data(f).incidents;
  return topbar(backBtn(), '', refreshBtn()) + `
    <h1 class="large">Incidents</h1>
    <p class="sub">Last 48 hours</p>
    ${!backend() ? `<div class="card"><h3>Needs the Fieldwatch backend</h3><p>County dispatch incidents and attendee reports come from the backend. Set its address in Settings.</p></div>`
      : !list ? `<div class="card"><h3>${S.busy ? 'Checking' : 'Cannot reach the backend'}</h3></div>`
      : !list.length ? `<div class="card"><h3>Nothing reported</h3><p>Nothing in the last 48 hours for this festival.</p></div>`
      : `<div class="group">${list.map(i => `<div class="row" style="align-items:flex-start"><span class="dot ${i.level === 'warning' ? 'warn' : 'watch'}" style="margin-top:6px"></span><div class="main"><div class="t">${esc(i.category)}</div><div class="s">${esc(i.summary)}</div><div class="s" style="font-size:13px;margin-top:4px">${esc(fmtWhen(i.occurredAt))}${i.location ? ', ' + esc(i.location) : ''}, ${esc(i.source)}</div></div></div>`).join('')}</div>`}
    <p class="note">Only safety-relevant traffic is kept. Names and numbers are removed. Reporting needs the iPhone app.</p>`;
};

screens.settings = () => topbar(backBtn(), 'Settings', '') + `
  <p class="h" style="margin-top:14px">Fieldwatch backend</p>
  <div class="group"><div class="row"><input id="backend" value="${esc(S.backend)}" placeholder="https://your-backend.example.com" inputmode="url" autocapitalize="off" style="flex:1;border:0;background:none;outline:none" onchange="setBackend(this.value)"></div></div>
  <p class="note">Optional. With a backend, alerts come pushed from its poller and radar frames from its cache; without one this page asks the National Weather Service and the NEXRAD archive directly.</p>
  <p class="h">Saved in this browser</p>
  <div class="group"><button class="row" onclick="forget()"><div class="main"><div class="t">Forget saved data</div><div class="s">Festival choice and cached weather</div></div>${I.chev}</button></div>
  <p class="h">About</p>
  <div class="card"><p>Weather and alerts: National Weather Service (api.weather.gov). Radar: ${esc(ATTRIBUTION)}. Map tiles: OpenStreetMap contributors. Festival dates and venues: each festival's own site. No account, no login; nothing leaves this browser except those requests.</p></div>`;

function setBackend(v){ S.backend = v.trim().replace(/\/+$/, ''); save(); toast(S.backend ? 'Backend saved' : 'Using NWS directly'); if (fest()) refresh(fest()); }
function forget(){ try{ localStorage.removeItem(STORE); }catch(e){} S.fest = null; S.cache = {}; S.backend = ''; S.stack = []; go('picker', null, { replace: true }); toast('Forgotten'); }

let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
async function share(id){
  const a = (data(fest()).alerts || []).find(x => x.id === id); if (!a) return;
  const text = `${a.event} for ${a.area}. ${a.headline || a.body.slice(0, 200)}`;
  try{ await navigator.share({ title: a.event, text }); }catch(e){ if (e && e.name !== 'AbortError') toast("Couldn't share on this device"); }
}

function render(rev){
  const app = document.getElementById('app');
  const fn = screens[S.screen] || screens.picker;
  app.innerHTML = `<div class="screen in ${rev ? 'rev' : ''}">${fn(S.param)}</div>`;
  if (S.screen === 'radar') { fitStage(); showFrame(); updatePlay(); updateRadarNote(); }
}

async function boot(){
  load();
  try{ FESTS = await (await fetch('festivals.json', { cache: 'no-cache' })).json(); }catch(e){ FESTS = []; }
  if (S.fest && !fest()) S.fest = null;
  S.screen = S.fest ? 'channels' : 'picker';
  render();
  if (fest()) refresh(fest());
  setInterval(() => { if (fest() && document.visibilityState === 'visible' && !S.busy) refresh(fest()); }, 5 * 60000);
}
boot();
</script>
