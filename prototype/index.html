<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fieldwatch</title>
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#141A22; --muted:#6B7684; --line:#E6EAEF;
  --accent:#4F4BE0; --ok:#2C9A66; --watch:#E9A62C; --warn:#DC4A3D; --on-watch:#2A1A00;
  --shadow:0 10px 30px rgba(20,26,34,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101826; --surface:#182233; --surface-2:#202C40; --ink:#EEF1F5; --muted:#97A3B5; --line:#26334A;
    --accent:#8F8BFF; --ok:#31AE74; --watch:#F0B13C; --warn:#EE5A4D; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#101826; --surface:#182233; --surface-2:#202C40; --ink:#EEF1F5; --muted:#97A3B5; --line:#26334A;
  --accent:#8F8BFF; --ok:#31AE74; --watch:#F0B13C; --warn:#EE5A4D; --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.35; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
input::-webkit-search-decoration,input::-webkit-search-cancel-button{-webkit-appearance:none}
.screen{min-height:100%;max-width:520px;margin:0 auto;padding:0 16px 40px}
@media (prefers-reduced-motion:no-preference){
  .screen.in{animation:slide .24s cubic-bezier(.2,.7,.2,1)}
  .screen.in.rev{animation-name:slideRev}
  @keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes slideRev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg);
  display:flex; align-items:center; justify-content:space-between; height:52px; margin:0 -16px; padding:0 8px;
}
.topbar .side{min-width:72px;display:flex;align-items:center}
.topbar .side.r{justify-content:flex-end}
.topbar .mid{flex:1;text-align:center;font-weight:600;font-size:17px}
.tb{display:inline-flex;align-items:center;gap:2px;padding:8px;border-radius:10px;color:var(--accent);font-weight:500}
.tb:active{background:var(--surface-2)}
.tb svg{width:22px;height:22px}
.large{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:18px}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:22px;
}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--muted)}
.h{font-size:13px;color:var(--muted);margin:0 0 8px 4px}
.group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:22px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:58px;position:relative;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
button.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25}
.row .s{color:var(--muted);font-size:14px;margin-top:2px}
.row .tr{text-align:right;color:var(--muted);font-size:14px;flex:none}
.row .tr b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.chev{width:18px;height:18px;color:var(--muted);flex:none;opacity:.7}
.badge{
  min-width:22px;height:22px;border-radius:11px;background:var(--warn);color:#fff;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;padding:0 7px;flex:none;
}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.warn{background:var(--warn)} .dot.watch{background:var(--watch)} .dot.ok{background:var(--ok)}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);
  font-size:14px;font-weight:600;margin-bottom:18px;
}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.pill.off i{background:var(--muted)}
.status{border-radius:20px;padding:22px 20px;margin-bottom:22px;color:#fff;position:relative;overflow:hidden}
.status.ok{background:var(--ok)}
.status.watch{background:var(--watch);color:var(--on-watch)}
.status.warn{background:var(--warn)}
.status h2{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.status p{margin-top:6px;font-size:15px;opacity:.88}
.status .tap{margin-top:14px;font-size:14px;font-weight:600;opacity:.95}
@media (prefers-reduced-motion:no-preference){
  .status.warn::after{content:"";position:absolute;inset:0;border-radius:20px;border:2px solid #fff;opacity:0;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
}
.card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:22px}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px}
.card p{color:var(--muted);font-size:15px}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;background:var(--accent);
  color:#fff;font-weight:600;font-size:17px;margin-bottom:12px;
}
.btn.quiet{background:var(--surface);color:var(--accent)}
.btn:active{opacity:.85}
.hourly{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hourly::-webkit-scrollbar{display:none}
.hr{flex:none;width:68px;background:var(--surface);border-radius:14px;padding:12px 6px;text-align:center}
.hr .tm{font-size:13px;color:var(--muted)}
.hr svg{width:26px;height:26px;margin:8px 0}
.hr .tp{font-weight:600;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
.tile{background:var(--surface);border-radius:14px;padding:12px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.tile .n{font-size:12px;color:var(--muted)}
.post{padding:14px 16px;position:relative}
.post+.post::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.post .t{font-weight:600}
.post .b{font-size:15px;color:var(--muted);margin-top:2px}
.post .at{font-size:13px;color:var(--muted);margin-top:6px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.big{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1}
.alerthead{border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:22px}
.alerthead.watch{background:var(--watch);color:var(--on-watch)}
.alerthead.warn{background:var(--warn)}
.alerthead .lv{font-size:14px;font-weight:600;opacity:.9}
.alerthead h2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.alerthead p{margin-top:8px;font-size:15px;opacity:.9}
.body{font-size:17px;line-height:1.5;margin-bottom:22px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;position:relative;font-size:15px}
.kv+.kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:500}
.play{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.play svg{width:18px;height:18px}
.play.on{background:var(--accent);color:#fff}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:8px;vertical-align:middle}
.bars i{width:3px;background:var(--accent);height:6px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .bars i{animation:bar .8s ease-in-out infinite alternate}
  .bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
  @keyframes bar{from{height:4px}to{height:14px}}
}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:18px 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s ease}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px;color:var(--muted)}
.step.done{color:var(--ink)}
.step .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.step .ck svg{width:12px;height:12px;opacity:0}
.step.done .ck svg{opacity:1}
.note{font-size:13px;color:var(--muted);margin:-10px 4px 22px}
.banner{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;z-index:50;max-width:500px;margin:0 auto;
  background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;
  transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:left;width:auto;
}
.banner.show{transform:none}
.banner .ic{width:38px;height:38px;border-radius:9px;background:var(--accent);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.banner .ic svg{width:22px;height:22px}
.banner .m{flex:1;min-width:0}
.banner .app{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.banner .t{display:block;font-weight:600;font-size:15px;margin-top:1px}
.banner .b{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-weight:600}
.link{color:var(--accent);font-weight:500}
.radar{position:relative;height:300px;border-radius:18px;overflow:hidden;margin-bottom:12px;background:#1d2733;background-image:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.07) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.07) 39px 40px)}
.radar .blob{position:absolute;border-radius:50%;filter:blur(12px);opacity:.8;animation:drift 16s linear infinite}
.radar .blob.a{width:160px;height:120px;left:-60px;top:70px;background:radial-gradient(ellipse,#c8102e 0%,#f2a900 32%,#ffe600 48%,#2fb04a 68%,transparent 76%)}
.radar .blob.b{width:120px;height:90px;left:30px;top:180px;background:radial-gradient(ellipse,#f2a900 0%,#ffe600 30%,#2fb04a 58%,transparent 74%);animation-delay:-6s}
.radar .blob.c{width:100px;height:80px;left:-90px;top:10px;background:radial-gradient(ellipse,#2fb04a 0%,transparent 70%);animation-delay:-11s}
.radar.paused .blob{animation-play-state:paused}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(420px)}}
.radar .pin{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #0a84ff,0 0 0 8px rgba(10,132,255,.25)}
.radar .rtime,.radar .rleg{position:absolute;background:rgba(255,255,255,.92);color:#111;border-radius:999px;font-variant-numeric:tabular-nums}
.radar .rtime{left:12px;top:12px;font-weight:600;font-size:14px;padding:6px 12px}
.radar .rleg{right:12px;bottom:12px;font-size:12px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.radar .rleg i{display:block;width:60px;height:8px;border-radius:999px;background:linear-gradient(90deg,#2fb04a,#ffe600,#f2a900,#c8102e,#a020a0)}
.rctl{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rctl input[type=range]{flex:1;accent-color:#0a84ff}
</style>
</head>

const S = {screen:'picker', param:null, stack:[], fest:null, online:true, packs:{}, loc:true, notif:true, relay:true, listening:null, seen:{}, demoCount:0, receiver:false, playingInc:null};

function load(){
  try{
    const raw = localStorage.getItem('fieldwatch');
    if(raw){ const d = JSON.parse(raw); Object.assign(S, {fest:d.fest||null, packs:d.packs||{}, loc:d.loc!==false, notif:d.notif!==false, relay:d.relay!==false}); }
  }catch(e){}
  S.demoAlerts = {};
  S.demoIncidents = {};
}
function save(){
  try{ localStorage.setItem('fieldwatch', JSON.stringify({fest:S.fest, packs:S.packs, loc:S.loc, notif:S.notif, relay:S.relay})); }catch(e){}
}
const fest = () => FESTS.find(f => f.id === S.fest);
const alertsFor = f => (f.alerts || []).concat(S.demoAlerts[f.id] || []);
const incidentsFor = f => (S.demoIncidents[f.id] || []).concat(f.incidents || []);
const INC_ICON = {threat:'shield', evacuation:'walk', weather:'storm', flood:'flood', fire:'fire', missing:'person', medical:'cross', crowd:'crowd', traffic:'road'};
const worst = f => alertsFor(f).some(a => a.level === 'warn') ? 'warn' : alertsFor(f).length ? 'watch' : 'ok';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function radarTime(i){
  const ago = (71 - i) * 10;
  const t = new Date(Date.now() - ago * 60000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return t + (ago === 0 ? ', now' : ago < 60 ? ', ' + ago + ' min ago' : ', ' + (Math.round(ago / 6) / 10) + ' h ago');
}
function radarScrub(v){
  document.getElementById('radar').classList.add('paused');
  document.getElementById('radar-time').textContent = radarTime(+v);
  const b = document.getElementById('radar-play'); b.classList.remove('on'); b.innerHTML = I.play; b.setAttribute('aria-label', 'Play');
}
function radarToggle(){
  const paused = document.getElementById('radar').classList.toggle('paused');
  const b = document.getElementById('radar-play'); b.classList.toggle('on', !paused); b.innerHTML = paused ? I.play : I.stop; b.setAttribute('aria-label', paused ? 'Play' : 'Pause');
}
function go(name, param, opts){
  opts = opts || {};
  if(!opts.replace) S.stack.push({name:S.screen, param:S.param});
  if(opts.reset) S.stack = [];
  S.screen = name; S.param = param || null;
  render(false); window.scrollTo(0,0);
}
function back(){
  const p = S.stack.pop();
  if(!p){ S.screen = S.fest ? 'channels' : 'picker'; S.param = null; }
  else { S.screen = p.name; S.param = p.param; }
  render(true); window.scrollTo(0,0);
}

function topbar(left, mid, right){
  return `<div class="topbar"><div class="side">${left||''}</div><div class="mid">${mid||''}</div><div class="side r">${right||''}</div></div>`;
}
const backBtn = () => `<button class="tb" onclick="back()" aria-label="Back">${I.back}</button>`;
const gearBtn = () => `<button class="tb" onclick="go('settings')" aria-label="Settings">${I.gear}</button>`;
const sw = (on, action) => `<button class="switch ${on?'on':''}" role="switch" aria-checked="${on}" onclick="act('${action}')"></button>`;

const screens = {};

screens.picker = () => {
  const row = f => `<button class="row" data-name="${esc(f.name.toLowerCase()+' '+f.where.toLowerCase())}" onclick="act('pick','${f.id}')">
    <div class="main"><div class="t">${esc(f.name)}</div><div class="s">${esc(f.where)}</div></div>
    <div class="tr"><b>${esc(f.dates)}</b>${f.mi.toLocaleString()} mi</div>${I.chev}</button>`;
  const next = FESTS.filter(f => f.when === 'next'), later = FESTS.filter(f => f.when !== 'next');
  return topbar('', '', gearBtn()) + `
    <h1 class="large">Which festival?</h1>
    <p class="sub">Pick one and it's ready to work offline.</p>
    <label class="search">${I.search}<input id="q" type="search" placeholder="Search festivals" autocomplete="off" oninput="filter(this.value)"></label>
    <div id="list">
      <div class="sec"><p class="h">Next weekend</p><div class="group">${next.map(row).join('')}</div></div>
      <div class="sec"><p class="h">Coming up</p><div class="group">${later.map(row).join('')}</div></div>
      <div id="none" class="empty" hidden><b>No festival by that name</b>Try the town or the state.</div>
    </div>`;
};
function filter(q){
  q = q.trim().toLowerCase(); let any = false;
  document.querySelectorAll('#list .sec').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.row').forEach(r => { const hit = !q || r.dataset.name.includes(q); r.hidden = !hit; if(hit) n++; });
    sec.hidden = n === 0; any = any || n > 0;
  });
  document.getElementById('none').hidden = any;
}

screens.download = () => {
  const f = fest();
  const steps = [['Site map', '31 MB'], ['Three-day forecast', '2 MB'], ['Medical, water and exits', '1 MB'], ['Alert history', '7 MB']];
  return topbar(`<button class="tb" onclick="go('picker',null,{replace:true})">${I.back}</button>`, '', '') + `
    <h1 class="large">${esc(f.name)}</h1>
    <p class="sub">${esc(f.where)}, ${esc(f.dates)}</p>
    <div class="card">
      <h3 id="dl-title">Getting it ready for offline</h3>
      <p id="dl-sub">Everything below stays on your phone.</p>
      <div class="prog"><i id="dl-bar"></i></div>
      ${steps.map((s,i) => `<div class="step" id="st${i}"><span class="ck">${I.check}</span><span style="flex:1">${s[0]}</span><span style="font-size:14px">${s[1]}</span></div>`).join('')}
    </div>`;
};
function runDownload(){
  const f = fest(); let i = 0;
  const tick = () => {
    if(S.screen !== 'download') return;
    const bar = document.getElementById('dl-bar'); if(!bar) return;
    bar.style.width = ((i+1)/4*100) + '%';
    const st = document.getElementById('st'+i); if(st) st.classList.add('done');
    i++;
    if(i < 4) setTimeout(tick, 550);
    else {
      document.getElementById('dl-title').textContent = 'Ready';
      document.getElementById('dl-sub').textContent = f.size + ' saved. Works with no signal.';
      S.packs[f.id] = f.size; save();
      setTimeout(() => go('channels', null, {replace:true, reset:true}), 700);
    }
  };
  setTimeout(tick, 400);
}

screens.channels = () => {
  const f = fest(); const al = alertsFor(f); const lv = worst(f);
  const head = lv === 'warn' ? al.find(a => a.level === 'warn').title
             : lv === 'watch' ? (al.length === 1 ? al[0].title : al.length + ' advisories in effect') : 'All clear';
  const sub = lv === 'ok' ? 'No weather alerts for ' + f.county + '.' : (lv === 'warn' ? 'Take shelter now. Stages and tents are not safe shelter.' : 'Until ' + al[0].until + '. Tap for details.');
  const unseenW = S.seen[f.id+'w'] ? 0 : al.length;
  const unseenO = S.seen[f.id+'o'] ? 0 : (f.posts || []).length;
  const nearby = S.relay ? 4 + (f.id.length % 5) : 0;

  return topbar(`<button class="tb" onclick="go('picker')">${I.back}<span>Change</span></button>`, '', gearBtn()) + `
    <h1 class="large">${esc(f.name)}</h1>

    <button class="status ${lv}" style="width:100%;text-align:left" onclick="${lv==='ok' ? "go('weather')" : "go('alert','"+(lv==='warn' ? al.find(a=>a.level==='warn').id : al[0].id)+"')"}">
      <h2>${esc(head)}</h2><p>${esc(sub)}</p>
      ${lv === 'ok' ? `<div class="tap">${S.online ? 'Checked just now' : 'Last checked 2 h ago, before signal dropped'}</div>` : ''}
    </button>
    <p class="h">Channels</p>
    <div class="group">
      <button class="row" onclick="go('weather')"><span class="dot ${lv}"></span><div class="main"><div class="t">Weather</div><div class="s">${al.length ? al.length + ' active alert' + (al.length>1?'s':'') : 'Forecast and hazards'}</div></div>${unseenW ? `<span class="badge">${unseenW}</span>` : ''}${I.chev}</button>
      <button class="row" onclick="go('official')"><div class="main"><div class="t">Festival official</div><div class="s">${f.partner ? 'Updates from the festival' : 'Site info, not yet partnered'}</div></div>${unseenO ? `<span class="badge">${unseenO}</span>` : ''}${I.chev}</button>
      <button class="row" onclick="go('incidents')"><div class="main"><div class="t">Incidents</div><div class="s">${S.receiver ? 'Receiver on site, live from county dispatch' : 'County dispatch and attendee reports'}</div></div>${(S.seen[f.id+'i'] ? 0 : incidentsFor(f).length) ? `<span class="badge">${incidentsFor(f).length}</span>` : ''}${I.chev}</button>
      <button class="row" onclick="go('relay')"><div class="main"><div class="t">Attendee relay</div><div class="s">${S.relay ? 'Sharing alerts with ' + nearby + ' phones nearby' : 'Off'}</div></div>${I.chev}</button>
      ${f.feeds.length ? `<button class="row" onclick="go('audio')"><div class="main"><div class="t">Live audio</div><div class="s">${S.online ? f.feeds.length + ' public feed' + (f.feeds.length>1?'s':'') + ' for ' + f.county : 'Needs a connection'}</div></div>${I.chev}</button>` : ''}
    </div>
    <p class="note">Emergency alerts from your carrier still arrive on their own, even when this app has no data.</p>`;
};

  const f = fest(); S.seen[f.id+'w'] = true; const al = alertsFor(f);

  const lvl = a.level === 'warn' ? 'Warning' : 'Advisory';
  return topbar(backBtn(), '', `<button class="tb" onclick="act('share','${a.id}')">Share</button>`) + `
    <div class="alerthead ${a.level}"><div class="lv">${lvl}</div><h2>${esc(a.title)}</h2><p>Until ${esc(a.until)}</p></div>
    <div class="body">${esc(a.text).replace(/\n\n/g,'<br><br>')}</div>
    <div class="group">
      <div class="kv"><span>Area</span><span>${esc(a.area)}</span></div>
      <div class="kv"><span>Source</span><span>${esc(a.source)}</span></div>
      <div class="kv"><span>Issued</span><span>${esc(a.at)}</span></div>
      <div class="kv"><span>Received</span><span>${a.via || 'Directly, over data'}</span></div>
    </div>
    <p class="note">Saved on your phone. You can open this with no signal.</p>`;
};

screens.settings = () => {
  const packs = Object.keys(S.packs);
  return topbar(backBtn(), 'Settings', '') + `
    <p class="h" style="margin-top:14px">Permissions</p>
    <div class="group">
      <div class="row"><div class="main"><div class="t">Location</div><div class="s">Sorts festivals by distance</div></div>${sw(S.loc,'toggleLoc')}</div>
      <div class="row"><div class="main"><div class="t">Notifications</div><div class="s">Weather and festival alerts</div></div>${sw(S.notif,'toggleNotif')}</div>
    </div>
    <p class="h">On-site receiver</p>
    <div class="group"><div class="row"><span class="dot ${S.receiver ? 'ok' : ''}" style="${S.receiver ? '' : 'background:var(--muted)'}"></span><div class="main"><div class="t">${S.receiver ? 'Connected to a receiver' : 'No receiver on this network'}</div></div></div></div>
    <p class="note">A receiver is a small box a volunteer runs on site. Join its Wi-Fi by scanning the QR code on the box and this phone finds it automatically.</p>
    <p class="h">Saved for offline</p>
    <div class="group">${packs.length ? packs.map(id => { const f = FESTS.find(x => x.id === id); return `<div class="row"><div class="main"><div class="t">${esc(f.name)}</div><div class="s">${f.size}</div></div><button class="link" onclick="act('remove','${id}')">Remove</button></div>`; }).join('')
                              : `<div class="row"><div class="main"><div class="s">Nothing saved yet</div></div></div>`}</div>
    <p class="h">Try it out</p>
    <div class="group">
      <button class="row" onclick="act('demoAlert')"><div class="main"><div class="t">Simulate a severe storm alert</div><div class="s">${S.fest ? 'Shows how an incoming warning looks' : 'Pick a festival first'}</div></div>${I.chev}</button>
      <button class="row" onclick="act('demoIncident')"><div class="main"><div class="t">Simulate a dispatch incident</div><div class="s">A radio call picked up by the receiver</div></div>${I.chev}</button>
      <button class="row" onclick="act('toggleReceiver')"><div class="main"><div class="t">${S.receiver ? 'Leave the receiver Wi-Fi' : 'Simulate joining a receiver'}</div><div class="s">${S.receiver ? 'Connected to the on-site receiver' : 'As if you scanned the QR code on the box'}</div></div>${I.chev}</button>
      <button class="row" onclick="act('toggleOnline')"><div class="main"><div class="t">${S.online ? 'Simulate losing signal' : 'Bring signal back'}</div><div class="s">Currently ${S.online ? 'online' : 'offline'}</div></div>${I.chev}</button>
      <button class="row" onclick="act('reset')"><div class="main"><div class="t">Reset the prototype</div></div>${I.chev}</button>
    </div>
    <p class="note">No account, no login. Nothing here leaves your phone.</p>`;
};

function act(name, p){
  const f = fest();
  switch(name){
    case 'pick': S.fest = p; S.seen = {}; S.listening = null; save(); S.packs[p] ? go('channels', null, {reset:true}) : go('download'); break;
    case 'toggleOnline': S.online = !S.online; S.listening = null; render(); toast(S.online ? 'Back online' : 'No signal. Saved data still works.'); break;
    case 'toggleRelay': S.relay = !S.relay; save(); render(); break;
    case 'toggleLoc': S.loc = !S.loc; save(); render(); break;
    case 'toggleNotif': S.notif = !S.notif; save(); render(); break;
    case 'listen': S.listening = S.listening === p ? null : p; render(); break;
    case 'remove': delete S.packs[p]; if(S.fest === p) S.fest = null; save(); render(); toast('Removed'); break;
    case 'reset': S.fest = null; S.packs = {}; S.demoAlerts = {}; S.online = true; S.seen = {}; save(); S.stack = []; go('picker', null, {replace:true}); toast('Reset'); break;
    case 'share': share(p); break;
    case 'playInc': S.playingInc = S.playingInc === p ? null : p; render(); break;
    case 'toggleReceiver': S.receiver = !S.receiver; render(); toast(S.receiver ? 'Receiver found on this network' : 'Receiver disconnected'); break;
    case 'sendReport': { const t = (document.getElementById('rep-text')||{}).value || ''; if(t.trim().length < 8){ toast('Say a little more'); return; } back(); toast('Sent for review'); break; }
    case 'demoIncident': if(!f){ toast('Pick a festival first'); return; } demoIncident(f); break;
    case 'demoAlert': if(!f){ toast('Pick a festival first'); return; } demoAlert(f); break;
  }
}

function demoIncident(f){
  S.demoCount++;
  const i = {id:'demo-inc-'+S.demoCount, category:'evacuation', level:'warning', title:'Evacuation notice', summary:'Command to all units: clear the main stage field, high winds, move everyone to the vehicle lots now.', at:'Just now', source:S.receiver ? 'County dispatch, via on-site receiver' : 'County dispatch', audio:true};
  S.demoIncidents[f.id] = [i].concat(S.demoIncidents[f.id] || []);
  S.seen[f.id+'i'] = false;
  if(S.screen !== 'settings') render();
  showBanner({id:i.id, title:i.title, text:i.summary, incident:true});
  if(navigator.vibrate){ try{ navigator.vibrate([80,60,80]); }catch(e){} }
}
function demoAlert(f){
  S.demoCount++;
  const a = {id:'demo-'+S.demoCount, level:'warn', title:'Severe Thunderstorm Warning', until:'7:30 PM tonight', area:f.county, source:'National Weather Service', at:'Issued 6:42 PM today',
    relayed: S.online ? 0 : 5, via: S.online ? 'Directly, over data' : 'From 5 phones nearby',
    text:'At 6:42 PM, a severe thunderstorm was located 9 miles southwest of the festival grounds, moving northeast at 25 mph.\n\nHazards: 60 mph wind gusts and quarter-size hail. Expect damage to tents, shade structures and stage rigging.\n\nGet inside a vehicle or a sturdy building. Stages, tents and shade structures are not safe shelter.'};
  S.demoAlerts[f.id] = (S.demoAlerts[f.id] || []).concat(a);
  S.seen[f.id+'w'] = false;
  if(S.screen !== 'settings') render();
  showBanner(a);
  if(navigator.vibrate){ try{ navigator.vibrate([80,60,80]); }catch(e){} }
}
let bannerTimer;
function showBanner(a){
  const b = document.getElementById('banner');
  b.innerHTML = `<span class="ic">${I.bell}</span><span class="m"><span class="app"><span>Fieldwatch</span><span>now</span></span><span class="t">${esc(a.title)}</span><span class="b">${esc(a.text.split('\n')[0])}</span></span>`;
  b.onclick = () => { hideBanner(); go(a.incident ? 'incident' : 'alert', a.id); };
  requestAnimationFrame(() => b.classList.add('show'));
  clearTimeout(bannerTimer); bannerTimer = setTimeout(hideBanner, 7000);
}
function hideBanner(){ document.getElementById('banner').classList.remove('show'); }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
async function share(id){
  const a = alertsFor(fest()).find(x => x.id === id); if(!a) return;
  const text = a.title + ' until ' + a.until + ' for ' + a.area + '. ' + a.text.split('\n')[0];
  try{
    if(navigator.share){ await navigator.share({title:a.title, text}); return; }
    await navigator.clipboard.writeText(text); toast('Copied');
  }catch(e){ if(e && e.name !== 'AbortError') toast('Couldn\'t share on this device'); }
}

function render(rev){
  const app = document.getElementById('app');
  const fn = screens[S.screen] || screens.picker;
  app.innerHTML = `<div class="screen in ${rev?'rev':''}">${fn(S.param)}</div>`;
  if(S.screen === 'download') runDownload();
}

load();
if(S.fest && S.packs[S.fest]) S.screen = 'channels';
render();
</script>
</body>
</html>
